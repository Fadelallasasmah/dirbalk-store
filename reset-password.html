<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="/assets/theme.js"></script>
<script src="/assets/toast.js"></script>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إعادة تعيين كلمة المرور — DIRBALَK</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container { width: 100%; max-width: 420px; text-align: center; }

  .brand-logo {
    width: 100%;
    max-width: 260px;
    height: auto;
    margin: 0 auto 0.4rem;
    display: block;
  }

  .brand-arabic {
    color: #C9A84C;
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 3rem;
    opacity: 0.85;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: #C9A84C;
    margin: 0 auto 3rem;
    opacity: 0.4;
  }

  h1 {
    font-size: 15px;
    letter-spacing: 1px;
    color: #ffffff;
    margin-bottom: 2rem;
    font-weight: normal;
  }

  .field { text-align: right; }

  label {
    display: block;
    color: rgba(255,255,255,0.4);
    font-size: 10px;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .form-group { display: flex; flex-direction: column; gap: 14px; margin-bottom: 8px; }

  input {
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.15);
    color: #ffffff;
    padding: 14px 18px;
    font-size: 13px;
    letter-spacing: 0.5px;
    outline: none;
    text-align: right;
    font-family: Arial, sans-serif;
    width: 100%;
    transition: border-color 0.2s;
  }

  input::placeholder { color: rgba(255,255,255,0.25); }
  input:focus { border-color: rgba(201,168,76,0.5); }
  input.field-error { border-color: rgba(255,80,80,0.6); }

  .password-wrap { position: relative; }
  .password-wrap input { padding-left: 44px; }
  .pw-toggle {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    cursor: pointer;
    font-size: 15px;
    opacity: 0.4;
    filter: grayscale(1);
    transition: opacity 0.2s;
  }
  .pw-toggle:hover, .pw-toggle.active { opacity: 0.9; }

  .field-msg {
    color: rgba(255,80,80,0.75);
    font-size: 10px;
    margin-top: 5px;
    min-height: 12px;
    display: none;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.2);
    color: #ffffff;
    font-size: 12px;
    letter-spacing: 4px;
    cursor: pointer;
    font-family: Arial, sans-serif;
    transition: all 0.2s;
    margin-top: 1.5rem;
    margin-bottom: 1.2rem;
  }

  .submit-btn:hover { border-color: rgba(201,168,76,0.4); }
  .submit-btn:disabled { cursor: default; opacity: 0.6; }

  .form-error {
    color: rgba(255,80,80,0.85);
    font-size: 12px;
    margin-top: 10px;
    display: none;
    line-height: 1.6;
  }

  .success-box {
    display: none;
  }

  .success-box p {
    color: #C9A84C;
    font-size: 13px;
    line-height: 1.9;
    margin-bottom: 1.5rem;
  }

  .success-box a {
    display: inline-block;
    background: #C9A84C;
    color: #0a0a0a;
    padding: 12px 26px;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 2px;
  }

  .invalid-box {
    display: none;
  }

  .invalid-box p {
    color: rgba(255,120,120,0.85);
    font-size: 13px;
    line-height: 1.9;
  }
</style>
</head>
<body>

<div class="container">
  <img src="/logo.png" alt="DIRBALK" class="brand-logo" />
  <p class="brand-arabic">دير بالك على حالك</p>
  <div class="divider"></div>

  <div id="form-section">
    <h1>اختر كلمة مرور جديدة</h1>

    <form id="reset-form" novalidate>
      <div class="form-group">
        <div class="field">
          <label for="password">كلمة المرور الجديدة</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="6 أحرف على الأقل" autocomplete="new-password" />
            <button type="button" class="pw-toggle" data-target="password" aria-label="إظهار كلمة المرور">👁</button>
          </div>
          <p class="field-msg" id="password-msg"></p>
        </div>
        <div class="field">
          <label for="confirmPassword">تأكيد كلمة المرور</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" placeholder="أعد كتابة كلمة المرور" autocomplete="new-password" />
            <button type="button" class="pw-toggle" data-target="confirmPassword" aria-label="إظهار كلمة المرور">👁</button>
          </div>
          <p class="field-msg" id="confirmPassword-msg"></p>
        </div>
      </div>

      <p class="form-error" id="form-error"></p>

      <button type="submit" class="submit-btn" id="submit-btn">
        حفظ كلمة المرور
      </button>
    </form>
  </div>

  <div class="success-box" id="success-box">
    <p>تم تحديث كلمة المرور بنجاح.</p>
    <a href="/signin.html">تسجيل الدخول</a>
  </div>

  <div class="invalid-box" id="invalid-box">
    <p>الرابط غير صالح أو منتهي الصلاحية.<br>جرّب تطلب رابط جديد من صفحة تسجيل الدخول.</p>
  </div>
</div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);

  document.querySelectorAll('.pw-toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      const showing = target.type === 'text';
      target.type = showing ? 'password' : 'text';
      btn.classList.toggle('active', !showing);
    });
  });

  const token = params.get('token') || '';
  const email = (params.get('email') || '').toLowerCase();

  if (!token || !email) {
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('invalid-box').style.display = 'block';
    return;
  }

  const form = document.getElementById('reset-form');
  const btn = document.getElementById('submit-btn');
  const formError = document.getElementById('form-error');

  let isSubmitting = false;
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (isSubmitting) return;
    formError.style.display = 'none';
    ['password', 'confirmPassword'].forEach((id) => {
      document.getElementById(id).classList.remove('field-error');
      document.getElementById(id + '-msg').style.display = 'none';
    });

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    let valid = true;

    if (password.length < 6) {
      document.getElementById('password').classList.add('field-error');
      document.getElementById('password-msg').textContent = 'كلمة المرور يجب أن تكون 6 أحرف على الأقل.';
      document.getElementById('password-msg').style.display = 'block';
      valid = false;
    }
    if (password !== confirmPassword) {
      document.getElementById('confirmPassword').classList.add('field-error');
      document.getElementById('confirmPassword-msg').textContent = 'كلمتا المرور غير متطابقتين.';
      document.getElementById('confirmPassword-msg').style.display = 'block';
      valid = false;
    }
    if (!valid) return;

    isSubmitting = true;
    btn.disabled = true;
    btn.textContent = 'جاري الحفظ...';

    try {
      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'reset', email, token, password }),
      });
      const result = await res.json();

      if (result.status === 'success') {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('success-box').style.display = 'block';
        if (window.DirbalkToast) DirbalkToast.success('تم تحديث كلمة المرور.');
      } else {
        formError.textContent = result.message || 'حدث خطأ مؤقت، يرجى المحاولة لاحقًا.';
        formError.style.display = 'block';
        if (window.DirbalkToast) DirbalkToast.error(result.message || 'ما قدرنا نحدّث كلمة المرور.');
        isSubmitting = false;
        btn.disabled = false;
        btn.textContent = 'حفظ كلمة المرور';
      }
    } catch (err) {
      formError.textContent = 'حدث خطأ مؤقت، يرجى المحاولة لاحقًا.';
      formError.style.display = 'block';
      if (window.DirbalkToast) DirbalkToast.error('حدث خطأ مؤقت، يرجى المحاولة لاحقًا.');
      isSubmitting = false;
      btn.disabled = false;
      btn.textContent = 'حفظ كلمة المرور';
    }
  });
})();
</script>

<style>
  /* ---------- unified site footer ---------- */
  .site-footer {
    width: 100%;
    border-top: 0.5px solid rgba(255,255,255,0.08);
    margin-top: 48px;
    padding: 36px 20px 44px;
    text-align: center;
  }
  .site-footer .footer-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px 26px;
    margin-bottom: 24px;
  }
  .site-footer .footer-links a {
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.45);
    text-decoration: none;
    transition: color 0.2s;
  }
  .site-footer .footer-links a:hover { color: #C9A84C; }
  .site-footer .footer-logo { height: 18px; width: auto; opacity: 0.65; }
</style>
<footer class="site-footer">
  <nav class="footer-links">
    <a href="/">الرئيسية</a>
    <a href="/shop.html">الكوليكشن</a>
    <a href="/about.html">عن DIRBALK</a>
    <a href="/shipping.html">الشحن والإرجاع</a>
    <a href="/privacy.html">سياسة الخصوصية</a>
    <a href="/signin.html">تسجيل الدخول</a>
  </nav>
  <img src="/logo.png" alt="DIRBALK" class="footer-logo" />
</footer>
</body>
</html>
