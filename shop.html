        'اغسله لحاله أول مرة، ماء بارد'
      ],
      swatch: '#2d3a52',
      silhouette: 'jacket',
      sizes: { S: 20, M: 60, L: 20 }
    }
  ];

  const CART_KEY = 'dirbalk_cart';
  window.canHover = window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  if (window.canHover) document.body.classList.add('can-hover');

  function silhouetteSVG(type, tint) {
    const stroke = 'rgba(255,255,255,0.15)';
    if (type === 'jacket') {
      return '<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg"><path d="M60 30 L80 20 L100 32 L120 20 L140 30 L155 60 L138 78 L128 62 L128 190 L72 190 L72 62 L62 78 L45 60 Z" fill="' + tint + '" stroke="' + stroke + '" stroke-width="1.5"/><line x1="100" y1="32" x2="100" y2="190" stroke="' + stroke + '" stroke-width="1" stroke-dasharray="2 3"/></svg>';
    }
    if (type === 'pants') {
      return '<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg"><path d="M75 20 L125 20 L130 60 L150 195 L120 195 L102 90 L98 90 L80 195 L50 195 L70 60 Z" fill="' + tint + '" stroke="' + stroke + '" stroke-width="1.5"/></svg>';
    }
    return '<svg viewBox="0 0 200 220" xmlns="http://www.w3.org/2000/svg"><path d="M70 30 L100 22 L130 30 L155 55 L138 72 L128 60 L128 190 L72 190 L72 60 L62 72 L45 55 Z" fill="' + tint + '" stroke="' + stroke + '" stroke-width="1.5"/></svg>';
  }

  function loadCart() {
    try { return JSON.parse(localStorage.getItem(CART_KEY) || '[]'); }
    catch (e) { return []; }
  }
  function saveCart(cart) {
    try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) { /* ignore */ }
  }

  let cart = loadCart();

  function findProduct(id) { return PRODUCTS.find((p) => p.id === id); }
  function totalStock(p) { return Object.values(p.sizes).reduce((a, b) => a + b, 0); }

  function cartCount() { return cart.reduce((s, l) => s + l.qty, 0); }
  function cartSubtotal() {
    return cart.reduce((s, l) => {
      const p = findProduct(l.id);
      return s + (p ? p.price * l.qty : 0);
    }, 0);
  }

  function updateCartBadge() {
    const badge = document.getElementById('cartBadge');
    const count = cartCount();
    if (count > 0) { badge.style.display = 'flex'; badge.textContent = count; }
    else badge.style.display = 'none';
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 2000);
  }

  /* ---------------- login gate ---------------- */
  let isLoggedIn = false;
  try { isLoggedIn = localStorage.getItem('dirbalk_logged_in') === '1'; } catch (e) { /* ignore */ }

  /* ---------------- render product grid (no stock numbers shown) ---------------- */
  const grid = document.getElementById('productGrid');
  if (isLoggedIn) {
    grid.style.display = 'grid';
  } else {
    document.getElementById('gateBox').style.display = 'block';
  }
  PRODUCTS.forEach((p) => {
    const soldOut = totalStock(p) === 0;
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML =
      '<div class="card-media">' + silhouetteSVG(p.silhouette, p.swatch) +
      '<span class="card-code">' + p.id + '</span>' +
      '<span class="card-tag' + (soldOut ? ' sold-out' : '') + '">' + (soldOut ? 'نفذت الكمية' : 'إصدار محدود') + '</span>' +
      '</div>' +
      '<div class="card-body">' +
      '<p class="card-name">' + p.name + '</p>' +
      '<p class="card-colorway">' + p.colorway + '</p>' +
      '<p class="card-price">' + p.price + ' دينار</p>' +
      '</div>';
    card.addEventListener('click', () => openModal(p.id));
    grid.appendChild(card);
  });

  /* ---------------- quick view modal ---------------- */
  let modalProduct = null;
  let modalSize = null;

  function openModal(id) {
    modalProduct = findProduct(id);
    modalSize = null;
    const svg = silhouetteSVG(modalProduct.silhouette, modalProduct.swatch);
    document.getElementById('modalMedia').innerHTML = svg +
      '<span class="zoom-hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M11 8v6M8 11h6"/></svg> ' +
      (window.canHover ? 'حرّك الماوس للتكبير' : 'اضغط للتكبير') + '</span>' +
      '<div class="zoom-pane" id="zoomPane">' + svg + '</div>';
    document.getElementById('modalCode').textContent = modalProduct.id;
    document.getElementById('modalTitle').textContent = modalProduct.name;
    document.getElementById('modalColorway').textContent = modalProduct.colorway;
    document.getElementById('modalPrice').textContent = modalProduct.price + ' دينار';
    document.getElementById('modalDesc').textContent = modalProduct.desc;
    document.getElementById('modalMsg').style.display = 'none';

    renderSpecSection('fitList', modalProduct.fit);
    renderSpecSection('careList', modalProduct.care);
    document.getElementById('modalMeta').textContent = 'كود: ' + modalProduct.id + ' · اللون: ' + modalProduct.colorway;

    const sizeRow = document.getElementById('sizeRow');
    sizeRow.innerHTML = '';
    Object.keys(modalProduct.sizes).forEach((sz) => {
      const stock = modalProduct.sizes[sz];
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'size-btn';
      btn.textContent = sz;
      if (stock === 0) btn.disabled = true;
      btn.addEventListener('click', () => {
        modalSize = sz;
        Array.from(sizeRow.children).forEach((b) => b.classList.remove('selected'));
        btn.classList.add('selected');
        document.getElementById('modalMsg').style.display = 'none';
      });
      sizeRow.appendChild(btn);
    });

    document.getElementById('modalOverlay').classList.add('open');
    if (window.gtag) gtag('event', 'view_item', { item_id: id });
  }

  function renderSpecSection(listId, items) {
    const list = document.getElementById(listId);
    list.innerHTML = '';
    items.forEach((text) => {
      const li = document.createElement('li');
      li.textContent = text;
      list.appendChild(li);
    });
  }

  document.getElementById('modalClose').addEventListener('click', () => {
    document.getElementById('modalOverlay').classList.remove('open');
  });
  document.getElementById('modalOverlay').addEventListener('click', (e) => {
    if (e.target.id === 'modalOverlay') document.getElementById('modalOverlay').classList.remove('open');
  });

  /* ---------------- zoom: lightbox (tap) + magnifier (hover) ---------------- */
  const modalMediaEl = document.getElementById('modalMedia');

  modalMediaEl.addEventListener('click', (e) => {
    if (!modalProduct) return;
    // On hover-capable desktops the magnifier already shows on hover,
    // so a click there opens the full lightbox for an even closer look.
    document.getElementById('lightboxMedia').innerHTML = silhouetteSVG(modalProduct.silhouette, modalProduct.swatch);
    document.getElementById('lightbox').classList.add('open');
  });

  modalMediaEl.addEventListener('mousemove', (e) => {
    if (!window.canHover || !modalProduct) return;
    modalMediaEl.classList.add('zooming');
    const rect = modalMediaEl.getBoundingClientRect();
    const xPct = Math.min(100, Math.max(0, ((e.clientX - rect.left) / rect.width) * 100));
    const yPct = Math.min(100, Math.max(0, ((e.clientY - rect.top) / rect.height) * 100));
    const zoomSvg = document.querySelector('#zoomPane svg');
    if (zoomSvg) {
      zoomSvg.style.transformOrigin = xPct + '% ' + yPct + '%';
    }
  });

  modalMediaEl.addEventListener('mouseleave', () => {
    modalMediaEl.classList.remove('zooming');
  });

  function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }
  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });

  document.getElementById('addToCartBtn').addEventListener('click', () => {
    if (!modalSize) {
      const msg = document.getElementById('modalMsg');
      msg.textContent = 'اختر مقاس أول.';
      msg.style.display = 'block';
      return;
    }
    const existing = cart.find((l) => l.id === modalProduct.id && l.size === modalSize);
    const currentQty = existing ? existing.qty : 0;
    const stock = modalProduct.sizes[modalSize];
    if (currentQty + 1 > stock) {
      const msg = document.getElementById('modalMsg');
      msg.textContent = 'ما في كمية كافية من هالمقاس.';
      msg.style.display = 'block';
      return;
    }
    if (existing) existing.qty += 1;
    else cart.push({ id: modalProduct.id, size: modalSize, qty: 1 });
    saveCart(cart);
    updateCartBadge();
    document.getElementById('modalOverlay').classList.remove('open');
    showToast('انضافت للسلة — ' + modalProduct.name + ' (' + modalSize + ')');
    if (window.gtag) gtag('event', 'add_to_cart', { item_id: modalProduct.id, size: modalSize });
  });

  /* ---------------- cart drawer ---------------- */
  function renderCart() {
    const container = document.getElementById('cartItems');
    container.innerHTML = '';
    if (cart.length === 0) {
      container.innerHTML = '<p class="cart-empty">السلة فاضية.</p>';
    } else {
      cart.forEach((line) => {
        const p = findProduct(line.id);
        if (!p) return;
        const row = document.createElement('div');
        row.className = 'cart-item';
        row.innerHTML =
          '<div class="cart-item-media">' + silhouetteSVG(p.silhouette, p.swatch) + '</div>' +
          '<div class="cart-item-info">' +
          '<p class="cart-item-name">' + p.name + '</p>' +
          '<p class="cart-item-size">مقاس ' + line.size + '</p>' +
          '<div class="cart-item-row">' +
          '<div class="qty-controls">' +
          '<button type="button" class="qty-btn" data-action="dec">−</button>' +
          '<span>' + line.qty + '</span>' +
          '<button type="button" class="qty-btn" data-action="inc">+</button>' +
          '</div>' +
          '<span class="cart-item-price">' + (p.price * line.qty) + ' JD</span>' +
          '</div>' +
          '<button type="button" class="remove-btn" data-action="remove">إزالة</button>' +
          '</div>';

        row.querySelector('[data-action="dec"]').addEventListener('click', () => {
          line.qty -= 1;
          if (line.qty <= 0) cart = cart.filter((l) => l !== line);
          saveCart(cart); renderCart(); updateCartBadge();
        });
        row.querySelector('[data-action="inc"]').addEventListener('click', () => {
          const stock = p.sizes[line.size] || 0;
          if (line.qty + 1 > stock) { showToast('ما في كمية كافية.'); return; }
          line.qty += 1;
          saveCart(cart); renderCart(); updateCartBadge();
        });
        row.querySelector('[data-action="remove"]').addEventListener('click', () => {
          cart = cart.filter((l) => l !== line);
          saveCart(cart); renderCart(); updateCartBadge();
        });

        container.appendChild(row);
      });
    }
    document.getElementById('cartSubtotal').textContent = cartSubtotal() + ' JD';
    const checkoutBtn = document.getElementById('checkoutBtn');
    if (cart.length === 0) checkoutBtn.classList.add('disabled');
    else checkoutBtn.classList.remove('disabled');
  }

  document.getElementById('cartBtn').addEventListener('click', () => {
    renderCart();
    document.getElementById('cartDrawer').classList.add('open');
    document.getElementById('cartOverlay').classList.add('open');
  });
  document.getElementById('cartClose').addEventListener('click', closeCart);
  document.getElementById('cartOverlay').addEventListener('click', closeCart);
  function closeCart() {
    document.getElementById('cartDrawer').classList.remove('open');
    document.getElementById('cartOverlay').classList.remove('open');
  }

  /* ---------------- account status ---------------- */
  try {
    if (localStorage.getItem('dirbalk_logged_in') === '1') {
      const name = localStorage.getItem('dirbalk_name') || '';
      const first = name.trim().split(' ')[0] || '';
      document.getElementById('accountLink').style.display = 'none';
      document.getElementById('userChip').style.display = 'flex';
      document.getElementById('userChipAvatar').textContent = first ? first.charAt(0).toUpperCase() : '?';
      document.getElementById('userChipName').textContent = first;

      document.getElementById('userChipLogout').addEventListener('click', () => {
        try {
          ['dirbalk_logged_in', 'dirbalk_gender', 'dirbalk_name', 'dirbalk_pending_verification', 'dirbalk_email', 'dirbalk_phone']
            .forEach((k) => localStorage.removeItem(k));
        } catch (e) { /* ignore */ }
        window.location.href = '/';
      });
    }
  } catch (e) { /* ignore */ }

  updateCartBadge();
})();
</script>

</body>
</html>
