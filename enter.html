<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<script src="/assets/theme.js"></script>
<script src="/assets/toast.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIRBALَK</title>
<meta name="robots" content="noindex, nofollow">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FMPZV540CP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FMPZV540CP');
</script>
<script src="/assets/meta-pixel.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  .brand-phrase { font-family: 'Cairo', Arial, sans-serif; font-weight: 700; }

  body {
    background: #0a0a0a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }

  .wrap { max-width: 380px; }

  .brand-logo {
    width: min(50vw, 200px);
    height: auto;
    margin-bottom: 2.6rem;
    opacity: 0.95;
  }

  .state { display: none; }
  .state.active { display: block; }

  .pulse-line {
    width: 40px;
    height: 1px;
    background: #C9A84C;
    margin: 0 auto 1.8rem;
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 0.25; } 50% { opacity: 0.9; } }

  .msg {
    color: rgba(255,255,255,0.72);
    font-size: 13px;
    line-height: 2;
  }

  .welcome-name {
    color: #C9A84C;
    font-size: 22px;
    margin-bottom: 10px;
  }

  .open-note {
    color: rgba(255,255,255,0.72);
    font-size: 13px;
    line-height: 2;
    margin-bottom: 6px;
  }

  .phrase { color: #C9A84C; font-size: 13px; margin-top: 14px; opacity: 0.85; }

  .err-actions { margin-top: 2rem; display: flex; gap: 10px; justify-content: center; }
  .btn {
    padding: 13px 26px;
    border: 0.5px solid rgba(255,255,255,0.2);
    color: #ffffff;
    font-size: 12px;
    letter-spacing: 1px;
    text-decoration: none;
    transition: all 0.2s;
  }
  .btn:hover { border-color: rgba(201,168,76,0.4); }
  .btn.primary { background: #C9A84C; color: #0a0a0a; border-color: #C9A84C; font-weight: bold; }
</style>
</head>
<body>
  <div class="wrap">
    <img src="/logo.png" alt="DIRBALK" class="brand-logo" />

    <div class="state active" id="stateChecking">
      <div class="pulse-line"></div>
      <p class="msg">Opening the door...</p>
    </div>

    <div class="state" id="stateWelcome">
      <p class="welcome-name" id="welcomeName"></p>
      <p class="open-note" id="openNote">The door is open.</p>
      <p class="phrase brand-phrase" id="welcomePhrase">دير بالك على حالك.</p>
    </div>

    <div class="state" id="stateError">
      <p class="msg" id="errMsg">This link isn't valid or has expired.</p>
      <div class="err-actions">
        <a href="/signin.html" class="btn primary">Get a new link</a>
        <a href="https://wa.me/962785734499" target="_blank" rel="noreferrer" class="btn">WhatsApp</a>
      </div>
    </div>
  </div>

<script>
(function () {
  function show(id) {
    document.querySelectorAll('.state').forEach(function (s) { s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  var params = new URLSearchParams(window.location.search);
  var token = params.get('t') || '';
  var email = (params.get('e') || '').toLowerCase();

  if (!token || !email) { show('stateError'); return; }
  try { history.replaceState(null, '', '/enter.html'); } catch (e) {} // the link is single-use — don't keep it in history

  fetch('/api/magic', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: token, email: email })
  })
    .then(function (r) { return r.json(); })
    .then(function (result) {
      if (result.status !== 'success' || !result.session) {
        if (result.message) document.getElementById('errMsg').textContent = result.message;
        show('stateError');
        return;
      }

      try {
        localStorage.setItem('dirbalk_session', result.session);
        localStorage.setItem('dirbalk_logged_in', '1');
        localStorage.setItem('dirbalk_name', result.name || '');
        localStorage.setItem('dirbalk_gender', result.gender || '');
        localStorage.setItem('dirbalk_email', result.email || '');
        if (result.phone) localStorage.setItem('dirbalk_phone', result.phone);
        if (window.gtag) gtag('event', 'login', { method: 'magic_link' });
      } catch (e) { /* ignore */ }

      var first = (result.name || '').trim().split(' ')[0] || '';
      var isFemale = result.gender === 'female';
      document.getElementById('welcomeName').textContent = 'Welcome, ' + first;
      document.getElementById('openNote').textContent = 'The door is open. Come in.';
      document.getElementById('welcomePhrase').textContent = 'دير بالك على حالك.';
      show('stateWelcome');

      /* back to the page they asked for the link from (same browser only), else the shop */
      var back = '/shop.html';
      try {
        var rt = localStorage.getItem('dirbalk_return_to') || '';
        if (/^\/[^\/]/.test(rt)) back = rt;
        localStorage.removeItem('dirbalk_return_to');
      } catch (e) { /* ignore */ }
      // v41: while the drop is closed, signing in only ever lands on the waiting page
      fetch('/api/passport', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"kind":"status"}' })
        .then(function (r) { return r.json(); })
        .then(function (st) { return !!(st && st.dropOpen); }, function () { return false; })
        .then(function (open) { setTimeout(function () { window.location.href = open ? back : '/'; }, 1800); });
    })
    .catch(function () { show('stateError'); });
})();
</script>
</body>
</html>
