<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
<title>For Nour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Nunito:wght@400;600;700;800&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: one centred "scene" at a time on a blush sky of floating hearts and sparkles; hand-drawn flowers in the corners; four little hearts track progress. Single deliberate light look. */
:root{
  --blush:#EAD6C8; --cream:#FBF5EF; --rose:#9C4F5E; --brown:#3A1A22; --peach:#D9B3A6;
  --rose-deep:#6B2232; --line:#E6D2C6;
  --serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --round:"Nunito",ui-rounded,"Segoe UI",system-ui,sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;color:var(--brown);font-family:var(--round);
  background:radial-gradient(90% 60% at 50% 0%,#F6ECE3 0%,var(--blush) 55%,#DCC2B0 100%);
  background-color:var(--blush);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:56px 32px;
  display:grid;place-items:center;overflow-x:hidden;
}

/* ---------- ambient layer ---------- */
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.float-heart{position:absolute;bottom:-40px;color:var(--rose);opacity:0;animation:rise linear infinite;will-change:transform,opacity}
.float-heart svg{display:block;width:100%;height:100%}
@keyframes rise{
  0%{transform:translate3d(0,0,0) rotate(-8deg);opacity:0}
  10%{opacity:.55}
  50%{transform:translate3d(18px,-55vh,0) rotate(8deg)}
  90%{opacity:.45}
  100%{transform:translate3d(-12px,-115vh,0) rotate(-6deg);opacity:0}
}
.spark{position:absolute;width:10px;height:10px;animation:twinkle 3.2s ease-in-out infinite}
.spark::before,.spark::after{content:"";position:absolute;left:50%;top:50%;background:#fff;border-radius:2px;transform:translate(-50%,-50%)}
.spark::before{width:2px;height:100%}
.spark::after{width:100%;height:2px}
@keyframes twinkle{0%,100%{opacity:.15;transform:scale(.6)}50%{opacity:.95;transform:scale(1)}}
.flower{position:fixed;width:150px;pointer-events:none;z-index:0;opacity:.9}
.flower.tl{top:-18px;left:-28px;transform:rotate(18deg)}
.flower.br{bottom:-22px;right:-30px;transform:rotate(200deg)}
@media (max-width:520px){.flower{width:110px}}

/* ---------- progress ---------- */
.progress{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:5}
.progress span{width:14px;height:14px;color:var(--cream);transition:color .4s,transform .4s}
.progress span svg{width:100%;height:100%;display:block;filter:drop-shadow(0 1px 1px rgba(58,26,34,.15))}
.progress span.on{color:var(--rose);transform:scale(1.15)}

/* ---------- scenes ---------- */
.stage{position:relative;z-index:2;width:100%;max-width:460px}
.scene{display:grid;justify-items:center;text-align:center;animation:sceneIn .8s cubic-bezier(.2,.8,.2,1) both}
.scene.out{animation:sceneOut .5s ease both}
@keyframes sceneIn{from{opacity:0;transform:translateY(16px) scale(.98);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes sceneOut{to{opacity:0;transform:translateY(-12px) scale(.98);filter:blur(4px)}}

h1,h2{font-family:var(--serif);font-weight:600;color:var(--brown);margin:0;text-wrap:balance}
.hey{font-size:clamp(44px,13vw,64px);line-height:1}
.hey em{font-style:italic;color:var(--rose-deep)}
.soft{font-size:18px;color:#6E4C54;margin:12px 0 0;line-height:1.5}

.btn{
  font-family:var(--round);font-weight:800;font-size:17px;letter-spacing:.01em;
  border:0;border-radius:999px;padding:15px 26px;cursor:pointer;
  background:var(--rose);color:var(--cream);
  box-shadow:0 10px 22px -8px rgba(107,34,50,.75),inset 0 -3px 0 rgba(58,26,34,.12);
  transition:transform .25s cubic-bezier(.3,1.6,.5,1),box-shadow .25s,background .25s;
  touch-action:manipulation;
}
.btn:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 16px 26px -10px rgba(107,34,50,.85),inset 0 -3px 0 rgba(58,26,34,.12)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:3px solid var(--brown);outline-offset:3px}
.btn.light{background:var(--cream);color:var(--brown);box-shadow:0 10px 22px -10px rgba(58,26,34,.35),inset 0 0 0 2px var(--peach)}
.btn.small{font-size:15px;padding:12px 22px}

/* ---------- envelope ---------- */
.env-wrap{margin:26px 0 26px;perspective:900px}
.envelope{position:relative;width:min(240px,68vw);aspect-ratio:1.45;max-width:100%;animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.env-back{position:absolute;inset:0;border-radius:14px;background:#4A1A25}
.env-letter{
  position:absolute;left:8%;right:8%;top:10%;height:78%;border-radius:8px;background:var(--cream);
  box-shadow:0 2px 6px rgba(58,26,34,.1);transition:transform .9s .55s cubic-bezier(.3,1.2,.4,1);
  display:grid;place-items:center;font-family:var(--hand);font-size:26px;color:var(--rose-deep)
}
.env-front{position:absolute;inset:0;border-radius:14px;overflow:hidden;pointer-events:none}
.env-front::before{content:"";position:absolute;inset:0;background:#7A2E3D;clip-path:polygon(0 0,50% 56%,100% 0,100% 100%,0 100%)}
.env-front::after{content:"";position:absolute;inset:0;background:#8A3A49;clip-path:polygon(0 100%,50% 50%,100% 100%)}
.env-flap{
  position:absolute;left:0;right:0;top:0;height:58%;transform-origin:50% 0;z-index:3;
  transition:transform .7s cubic-bezier(.4,.1,.3,1),z-index 0s .35s;
}
.env-flap::before{content:"";position:absolute;inset:0;background:#6B2232;clip-path:polygon(0 0,100% 0,50% 100%);border-radius:14px 14px 0 0}
.seal{
  position:absolute;left:50%;top:56%;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:4;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#F3E2D2,#C9A27E);
  display:grid;place-items:center;color:#6B2232;box-shadow:0 4px 8px rgba(58,26,34,.25);
  transition:transform .4s,opacity .4s
}
.seal svg{width:20px;height:20px}
.envelope.open{animation:none}
#scene1 .hey,#scene1 .soft{transition:opacity .4s,transform .4s}
#scene1.opening .hey,#scene1.opening .soft{opacity:0;transform:translateY(-10px)}
.envelope.open .seal{transform:scale(0) rotate(40deg);opacity:0}
.envelope.open .env-flap{transform:rotateX(180deg);z-index:0}
.envelope.open .env-letter{transform:translateY(-58%)}

/* ---------- letter ---------- */
.letter{
  position:relative;width:100%;background:var(--cream);border-radius:18px;padding:34px 28px 28px;text-align:left;
  box-shadow:0 24px 50px -24px rgba(58,26,34,.45),0 2px 0 var(--line);
  background-image:repeating-linear-gradient(transparent 0 37px,var(--line) 37px 38px);
  background-position:0 60px;
}
.letter::before{content:"";position:absolute;top:-12px;left:50%;width:90px;height:24px;margin-left:-45px;background:rgba(217,179,166,.75);border-radius:3px;transform:rotate(-3deg)}
.letter .dear{font-family:var(--hand);font-size:38px;color:var(--rose-deep);margin:0 0 6px;line-height:1}
.letter p{font-family:var(--hand);font-size:25px;line-height:38px;margin:0;color:var(--brown)}
.letter p + p{margin-top:0}
.line-in{opacity:0;animation:lineIn .7s ease forwards}
@keyframes lineIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.letter .doodle{position:absolute;right:18px;bottom:16px;width:44px;color:var(--rose);opacity:.8}
.after-letter{margin-top:26px}

/* ---------- question ---------- */
.ring{width:92px;margin:0 auto 14px;animation:bob 3.6s ease-in-out infinite}
.eyebrow{font-family:var(--hand);font-size:26px;color:var(--rose-deep);margin:0 0 6px}
.question{font-size:clamp(46px,13vw,72px);line-height:.98}
.question em{font-style:italic;color:var(--rose-deep);position:relative;white-space:nowrap}
.question em svg{position:absolute;left:-4%;bottom:-.18em;width:108%;height:.35em;color:var(--peach);z-index:-1}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;margin-top:26px}
/* question reveal */
#scene3 .ring{opacity:0;animation:wordIn .8s ease forwards, bob 3.6s 1s ease-in-out infinite}
.w{display:inline-block;opacity:0;transform:translateY(14px);filter:blur(6px);animation:wordIn 1s cubic-bezier(.2,.8,.2,1) var(--d) forwards}
@keyframes wordIn{to{opacity:1;transform:none;filter:none}}
.question .ul{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s ease 3.5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.typed{white-space:pre-line;min-height:3.2em;margin-top:22px}
.typed .caret{display:inline-block;width:2px;height:1.05em;background:var(--rose-deep);vertical-align:-.15em;margin-left:2px;animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#choices{opacity:0;transform:translateY(10px);transition:opacity .7s,transform .7s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
#choices.show{opacity:1;transform:none;pointer-events:auto}
.choices .btn{font-size:19px;padding:17px 30px}
.choices .btn:hover{animation:wiggle .5s ease}
@keyframes wiggle{0%,100%{transform:translateY(-3px) rotate(0)}25%{transform:translateY(-3px) rotate(-3deg)}75%{transform:translateY(-3px) rotate(3deg)}}

/* ---------- ending ---------- */
.yay{font-size:clamp(40px,11vw,62px);text-wrap:balance;line-height:1;color:var(--rose-deep);font-style:italic}
.stuck{font-family:var(--serif);font-size:clamp(22px,6vw,28px);margin:14px 0 18px;line-height:1.25}
.moments{font-family:var(--serif);font-style:italic;font-size:clamp(20px,5.5vw,24px);line-height:1.4;color:#5E3C44;max-width:34ch;margin:0 auto 18px}
.love{font-family:var(--hand);font-size:44px;color:var(--rose-deep);line-height:1;margin:0}
.sign{font-family:var(--hand);font-size:34px;color:var(--brown);margin:8px 0 0}
.polaroid{
  width:min(360px,100%);background:var(--cream);border-radius:16px;padding:28px 22px 24px;margin-bottom:24px;
  box-shadow:0 24px 50px -24px rgba(58,26,34,.45);transform:rotate(-1.5deg)
}
.tell{margin-top:26px;background:none;border:0;font-family:var(--round);font-weight:700;font-size:14px;color:var(--rose-deep);cursor:pointer;text-decoration:underline;text-underline-offset:4px;padding:8px}
.tell:disabled{text-decoration:none;cursor:default}
.tell-note{font-size:13px;color:#6E4C54;min-height:1.3em;margin:2px 0 0}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:10}

/* ---------- music ---------- */
.music{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;
  width:46px;height:46px;border-radius:50%;border:0;background:var(--cream);color:var(--rose-deep);cursor:pointer;
  box-shadow:0 8px 18px -8px rgba(58,26,34,.4);display:grid;place-items:center;transition:transform .2s,opacity .4s}
.music:hover{transform:scale(1.08)}
.music:focus-visible{outline:3px solid var(--brown);outline-offset:3px}
.music svg{width:20px;height:20px;transition:opacity .3s}
.music .slash{position:absolute;width:24px;height:2px;background:var(--rose-deep);border-radius:2px;transform:rotate(-45deg);opacity:1;transition:opacity .3s}
.music.playing .slash{opacity:0}
.music:not(.playing) svg{opacity:.55}
.music.playing svg{animation:noteBob 1.1s ease-in-out infinite}
@keyframes noteBob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-2px) rotate(6deg)}}
.music::before,.music::after{content:"\266A";position:absolute;top:2px;font-size:12px;color:var(--rose);opacity:0;pointer-events:none}
.music::before{left:6px}.music::after{right:4px;content:"\266B"}
.music.playing::before{animation:noteUp 2.4s ease-out infinite}
.music.playing::after{animation:noteUp 2.4s 1.2s ease-out infinite}
@keyframes noteUp{0%{opacity:0;transform:translateY(0) scale(.7)}20%{opacity:.9}100%{opacity:0;transform:translateY(-26px) scale(1.1)}}
.music.playing{animation:pulse 2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(156,79,94,.18)}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.line-in{opacity:1}}

/* ---------- 8·11 date tag ---------- */
.datetag{position:relative;display:inline-grid;justify-items:center;margin:0 0 18px;padding:12px 22px 10px;background:var(--cream);border-radius:16px;
  box-shadow:0 14px 26px -14px rgba(58,26,34,.5),inset 0 0 0 1.5px var(--peach);transform:rotate(-4deg);animation:tagIn .9s cubic-bezier(.3,1.5,.5,1) both}
@keyframes tagIn{from{transform:rotate(-14deg) scale(.6);opacity:0}to{transform:rotate(-4deg) scale(1);opacity:1}}
.dt-small{font-family:var(--hand);font-size:22px;color:var(--rose);line-height:1}
.dt-num{font-family:var(--serif);font-style:italic;font-weight:600;font-size:46px;line-height:1;color:var(--rose-deep);letter-spacing:.02em;font-variant-numeric:lining-nums}
.dt-num i{font-style:normal;color:#C9A27E;margin:0 .12em}
.dt-heart{position:absolute;right:-10px;top:-10px;width:24px;color:var(--rose-deep);animation:beat 1.4s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1) rotate(12deg)}15%{transform:scale(1.25) rotate(12deg)}30%{transform:scale(1) rotate(12deg)}45%{transform:scale(1.15) rotate(12deg)}}
.dt-spark{position:absolute;width:12px;height:12px;animation:twinkle 2.4s ease-in-out infinite}
.dt-spark::before,.dt-spark::after{content:"";position:absolute;left:50%;top:50%;background:#C9A27E;border-radius:2px;transform:translate(-50%,-50%)}
.dt-spark::before{width:2px;height:100%}.dt-spark::after{width:100%;height:2px}
.dt-spark.s1{left:-14px;top:6px}.dt-spark.s2{left:-6px;bottom:-8px;width:8px;height:8px;animation-delay:-.8s}.dt-spark.s3{right:6px;bottom:-12px;width:9px;height:9px;animation-delay:-1.6s}
.hl{font-weight:800;color:var(--rose-deep);background:linear-gradient(transparent 60%,rgba(217,179,166,.8) 60%);padding:0 2px}
#scene1 .soft{margin-top:8px}
/* ---------- checklist ---------- */
.letter.file p{font-size:24px}
.checklist{list-style:none;margin:10px 0 10px;padding:0;display:grid;gap:0}
.checklist li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;height:38px;line-height:38px;font-family:var(--round);font-size:15px;color:var(--brown)}
.checklist li span{font-weight:700}
.checklist li b{font-weight:800;color:#2f6b4f;white-space:nowrap}
.checklist li.pending b{color:var(--rose-deep)}
.dots i{font-style:normal;animation:dot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,100%{opacity:.2}50%{opacity:1}}
.btn.big{font-size:22px;padding:19px 42px}
.final-line{font-family:var(--round);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:#6E4C54;margin:0 0 10px}
.final-line b{color:#2f6b4f}

.ghost{visibility:hidden}
.letter .caret{display:inline-block;width:2px;height:.9em;background:var(--rose-deep);vertical-align:-.1em;margin-left:1px;animation:blink .8s steps(1) infinite}
.reveal-later{opacity:0;transform:translateY(10px);transition:opacity .7s,transform .7s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
.reveal-later.show{opacity:1;transform:none;pointer-events:auto}
.qheart{color:var(--rose-deep);font-size:.6em;vertical-align:.35em}
.qheart.w{animation:wordIn 1s cubic-bezier(.2,.8,.2,1) var(--d) forwards, beatq 1.4s calc(var(--d) + 1s) ease-in-out infinite}
@keyframes beatq{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.12)}}
.stuck{font-size:clamp(22px,6vw,28px)}
</style>
</head>
<body>


<!-- shared heart shape -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="heart" viewBox="0 0 24 22"><path fill="currentColor" d="M12 21.5C5.6 16.6 1 12.7 1 7.4 1 3.9 3.7 1 7 1c2 0 3.8 1 5 2.7C13.2 2 15 1 17 1c3.3 0 6 2.9 6 6.4 0 5.3-4.6 9.2-11 14.1z"/></symbol>
</svg>

<div class="sky" id="sky" aria-hidden="true"></div>

<!-- hand-drawn flower sprigs -->
<svg class="flower tl" viewBox="0 0 160 160" aria-hidden="true" fill="none" stroke="#3A1A22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M20 150 C50 110 70 80 112 40" />
  <path d="M60 104 C48 92 40 92 30 96 C40 104 50 106 60 104Z" fill="#D9B3A6"/>
  <path d="M84 72 C92 60 102 58 112 60 C104 70 94 74 84 72Z" fill="#D9B3A6"/>
  <g transform="translate(116 36)"><circle r="7" fill="#FBF5EF"/><path d="M0-7 C6-20 18-10 7-2 C20 0 14 16 2 7 C2 20-14 18-6 4 C-20 4-16-12-3-6 C-8-18 0-20 0-7Z" fill="#9C4F5E"/><circle r="4" fill="#EAD6C8"/></g>
  <g transform="translate(46 118) scale(.7)"><path d="M0-7 C6-20 18-10 7-2 C20 0 14 16 2 7 C2 20-14 18-6 4 C-20 4-16-12-3-6 C-8-18 0-20 0-7Z" fill="#EAD6C8"/><circle r="4" fill="#9C4F5E"/></g>
</svg>
<svg class="flower br" viewBox="0 0 160 160" aria-hidden="true" fill="none" stroke="#3A1A22" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <path d="M20 150 C50 110 70 80 112 40" />
  <path d="M60 104 C48 92 40 92 30 96 C40 104 50 106 60 104Z" fill="#D9B3A6"/>
  <path d="M84 72 C92 60 102 58 112 60 C104 70 94 74 84 72Z" fill="#D9B3A6"/>
  <g transform="translate(116 36)"><path d="M0-7 C6-20 18-10 7-2 C20 0 14 16 2 7 C2 20-14 18-6 4 C-20 4-16-12-3-6 C-8-18 0-20 0-7Z" fill="#9C4F5E"/><circle r="4" fill="#EAD6C8"/></g>
</svg>

<nav class="progress" aria-label="Progress">
  <span class="on"><svg><use href="#heart"/></svg></span>
  <span><svg><use href="#heart"/></svg></span>
  <span><svg><use href="#heart"/></svg></span>
  <span><svg><use href="#heart"/></svg></span>
</nav>

<main class="stage" id="stage">

  <!-- Scene 1: Hello -->
  <section class="scene" id="scene1">
    <div class="datetag" aria-label="8 November">
      <span class="dt-spark s1"></span><span class="dt-spark s2"></span><span class="dt-spark s3"></span>
      <span class="dt-small">today</span>
      <span class="dt-num">8<i>·</i>11</span>
      <svg class="dt-heart" viewBox="0 0 24 22" aria-hidden="true"><use href="#heart"/></svg>
    </div>
    <h1 class="hey">Hey <em>Nour</em>,</h1>
    <p class="soft">I have a little question for you...</p>
    <div class="env-wrap">
      <div class="envelope" id="envelope">
        <div class="env-back"></div>
        <div class="env-letter">for you ♡</div>
        <div class="env-front"></div>
        <div class="env-flap"></div>
        <div class="seal"><svg><use href="#heart"/></svg></div>
      </div>
    </div>
    <button class="btn" id="openBtn">Okay, what's this?</button>
  </section>

  <!-- Scene 2: The build-up -->
  <section class="scene" id="scene2" hidden>
    <article class="letter">
      <p class="dear" data-type>Sooo...</p>
      <p data-type>After all the talking, planning, and getting our families together...</p>
      <p data-type>There's just one thing left.</p>
      <svg class="doodle" viewBox="0 0 24 22" aria-hidden="true"><use href="#heart"/></svg>
    </article>
    <div class="after-letter reveal-later" id="after2">
      <button class="btn small" id="questionBtn">Continue</button>
    </div>
  </section>

  <!-- Scene 3: The question -->
  <section class="scene" id="scene3" hidden>
    <svg class="ring" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="64" r="25" fill="none" stroke="#9C4F5E" stroke-width="7"/>
      <circle cx="50" cy="64" r="25" fill="none" stroke="#FBF5EF" stroke-width="2" stroke-dasharray="8 70" stroke-linecap="round" transform="rotate(200 50 64)"/>
      <path d="M36 27 L43 15 H57 L64 27 L50 44 Z" fill="#FBF5EF" stroke="#3A1A22" stroke-width="2" stroke-linejoin="round"/>
      <path d="M36 27 H64 M43 15 L50 27 L57 15 M50 27 V44" stroke="#3A1A22" stroke-width="1.3" fill="none"/>
      <g fill="#fff"><path d="M78 16 l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/><path d="M20 34 l1.4 4 4 1.4-4 1.4-1.4 4-1.4-4-4-1.4 4-1.4z"/></g>
    </svg>
    <h2 class="question"><span class="w" style="--d:.4s">Nour,</span> <span class="w" style="--d:1.5s">will you</span> <em class="w" style="--d:2.6s">marry me?<svg viewBox="0 0 200 20" preserveAspectRatio="none" aria-hidden="true"><path class="ul" pathLength="1" d="M2 12 C50 2 150 2 198 12" stroke="currentColor" stroke-width="12" fill="none" stroke-linecap="round"/></svg></em> <span class="w qheart" style="--d:3.9s">♡</span></h2>
    <div class="choices" id="choices">
      <button class="btn big" data-yes>YES, OBVIOUSLY!</button>
    </div>
  </section>

  <!-- Scene 4: The ending -->
  <section class="scene" id="scene4" hidden>
    <div class="polaroid">
      <h2 class="yay">SHE SAID YES!! ♡</h2>
      <p class="stuck">Well, we're making it official. ❤️</p>
      <p class="sign">Fadel &amp; Nour</p>
    </div>
    <button class="tell" id="tellBtn">Let Fadel know you said yes ♡</button>
    <p class="tell-note" id="tellNote"></p>
  </section>
</main>

<!-- Music: place the legally obtained track next to this page as "married-life.mp3" -->
<audio id="song" src="married-life.mp3" preload="auto" loop playsinline></audio>
<button class="music" id="music" aria-label="Play music" aria-pressed="false" title="Music">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 18.5a2.5 2.5 0 1 1-2-2.45V5l11-2v12.5a2.5 2.5 0 1 1-2-2.45V7.1l-7 1.3z"/></svg>
  <span class="slash" aria-hidden="true"></span>
</button>

<canvas id="fx"></canvas>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const EMAIL = "hamzafadel828@gmail.com";

  /* ---------- ambient hearts & sparkles ---------- */
  const sky = $("sky");
  const heartSVG = '<svg viewBox="0 0 24 22"><use href="#heart"/></svg>';
  const shades = ["#9C4F5E","#D9B3A6","#B76E7D","#FBF5EF"];
  for (let i = 0; i < 14; i++){
    const h = document.createElement("span");
    const s = 10 + Math.random()*16;
    h.className = "float-heart";
    h.innerHTML = heartSVG;
    h.style.cssText = `left:${Math.random()*100}%;width:${s}px;height:${s}px;color:${shades[i%4]};animation-duration:${14+Math.random()*12}s;animation-delay:${-Math.random()*24}s`;
    sky.appendChild(h);
  }
  for (let i = 0; i < 18; i++){
    const sp = document.createElement("span");
    const s = 6 + Math.random()*8;
    sp.className = "spark";
    sp.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;width:${s}px;height:${s}px;animation-delay:${-Math.random()*3.2}s`;
    sky.appendChild(sp);
  }

  /* ---------- scene flow ---------- */
  const dots = [...document.querySelectorAll(".progress span")];
  let current = 1;
  function go(n){
    const from = $("scene"+current), to = $("scene"+n);
    const swap = () => { from.hidden = true; from.classList.remove("out"); to.hidden = false; current = n;
      dots.forEach((d,i) => d.classList.toggle("on", i < n));
      if (n === 2) startLetter(); if (n === 3) startQuestion(); };
    if (reduced) return swap();
    from.classList.add("out");
    setTimeout(swap, 480);
  }

  $("openBtn").addEventListener("click", () => {
    $("openBtn").disabled = true;
    $("envelope").classList.add("open");
    $("scene1").classList.add("opening");
    setTimeout(() => go(2), reduced ? 0 : 1700);
  });
  $("questionBtn").addEventListener("click", () => go(3));

  /* question: words fade in (CSS), then the line types itself letter by letter */
  let typing = false;
  function startQuestion(){
    if (typing) return; typing = true;
    setTimeout(() => $("choices").classList.add("show"), reduced ? 0 : 4700);
  }

  /* letter: each line types itself letter by letter, layout reserved so nothing jumps */
  let lettered = false;
  function startLetter(){
    if (lettered) return; lettered = true;
    const lines = [...document.querySelectorAll("[data-type]")], after = $("after2");
    if (reduced){ after.classList.add("show"); return; }
    const caret = document.createElement("span"); caret.className = "caret";
    const prepared = lines.map(p => {
      const text = p.textContent; p.textContent = "";
      const shown = document.createElement("span"), ghost = document.createElement("span");
      ghost.className = "ghost"; ghost.textContent = text; p.append(shown, ghost);
      return {text, shown, ghost};
    });
    let li = 0, ci = 0;
    function step(){
      const L = prepared[li];
      ci++; L.shown.textContent = L.text.slice(0, ci); L.ghost.textContent = L.text.slice(ci);
      L.shown.after(caret);
      if (ci < L.text.length){
        const ch = L.text[ci-1];
        setTimeout(step, ch === "." ? 230 : ch === "," ? 180 : 42 + Math.random()*38);
      } else if (++li < prepared.length){ ci = 0; setTimeout(step, 650); }
      else setTimeout(() => { caret.remove(); after.classList.add("show"); }, 600);
    }
    setTimeout(step, 700);
  }
  document.querySelectorAll("[data-yes]").forEach(b => b.addEventListener("click", () => {
    go(4);
    setTimeout(celebrate, reduced ? 0 : 450);
  }));

  /* ---------- music: "Married Life" (local file), starts on first tap, never restarts ---------- */
  const MUSIC = { start: 0, volume: 0.7, fadeIn: 2, fadeOut: 0.6 };   // start = seconds into the track
  const song = $("song"), mbtn = $("music");
  let actx = null, gain = null, started = false, on = false, fadeRaf = 0;

  function setUI(playing){
    on = playing;
    mbtn.classList.toggle("playing", playing);
    mbtn.setAttribute("aria-pressed", playing);
    mbtn.setAttribute("aria-label", playing ? "Mute music" : "Play music");
  }
  // Web Audio gain gives a real fade on iPhone (iOS ignores audio.volume); fall back to volume elsewhere.
  function initGraph(){
    if (actx || !/^https?:$/.test(location.protocol)) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      actx = new AC();
      gain = actx.createGain(); gain.gain.value = 0;
      actx.createMediaElementSource(song).connect(gain).connect(actx.destination);
    } catch(e){ actx = null; gain = null; }
  }
  function fadeTo(target, secs, done){
    cancelAnimationFrame(fadeRaf);
    if (gain){
      const t = actx.currentTime, g = gain.gain;
      g.cancelScheduledValues(t); g.setValueAtTime(g.value, t); g.linearRampToValueAtTime(target, t + secs);
      if (done) setTimeout(done, secs*1000 + 30);
      return;
    }
    const from = song.volume, t0 = performance.now();
    (function step(now){
      const k = Math.min(1, (now - t0)/(secs*1000));
      song.volume = Math.max(0, Math.min(1, from + (target - from)*k));
      if (k < 1) fadeRaf = requestAnimationFrame(step); else if (done) done();
    })(t0);
  }
  function playMusic(){
    initGraph();
    if (actx && actx.state === "suspended") actx.resume();
    if (!gain) song.volume = 0;
    if (!started){ try { song.currentTime = MUSIC.start; } catch(e){} }
    const p = song.play();
    const ok = () => {
      if (!started && MUSIC.start && Math.abs(song.currentTime - MUSIC.start) > 1){ try { song.currentTime = MUSIC.start; } catch(e){} }
      started = true; setUI(true); fadeTo(MUSIC.volume, MUSIC.fadeIn);
    };
    if (p && p.then) p.then(ok).catch(() => { setUI(false); if (song.error) noFile(); }); else ok();
  }
  function muteMusic(){
    setUI(false);
    fadeTo(0, MUSIC.fadeOut, () => { if (!on) song.pause(); });   // pause keeps the position, so it never restarts
  }
  mbtn.addEventListener("click", () => on ? muteMusic() : playMusic());
  $("openBtn").addEventListener("click", () => { if (!started) playMusic(); });   // first genuine tap starts the song
  const noFile = () => { mbtn.hidden = true; setUI(false); };                 // no file yet: hide the toggle quietly
  song.addEventListener("error", noFile); if (song.error) noFile();
  document.addEventListener("visibilitychange", () => { if (!document.hidden && on && song.paused) song.play().catch(()=>{}); });

  /* ---------- celebration ---------- */
  const cv = $("fx"), ctx = cv.getContext("2d");
  let parts = [], running = false;
  function size(){ cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; }
  addEventListener("resize", size); size();
  function drawHeart(s){ ctx.beginPath(); ctx.moveTo(0, s*.35); ctx.bezierCurveTo(-s*1.05,-s*.35,-s*.45,-s*1.15,0,-s*.45); ctx.bezierCurveTo(s*.45,-s*1.15,s*1.05,-s*.35,0,s*.35); ctx.fill(); }
  function drawStar(s){ ctx.beginPath(); for (let i=0;i<8;i++){ const r = i%2 ? s*.35 : s; const a = i*Math.PI/4; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); } ctx.closePath(); ctx.fill(); }
  function burst(x, y, n){
    const cols = ["#9C4F5E","#D9B3A6","#6B2232","#FBF5EF","#B76E7D","#f3d38a"];
    for (let i = 0; i < n; i++){
      const a = Math.random()*Math.PI*2, sp = 4 + Math.random()*9;
      parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 5, r:Math.random()*6, vr:(Math.random()-.5)*.25,
        s:4 + Math.random()*7, c:cols[i%cols.length], kind:i%4===0 ? "star" : i%2 ? "heart" : "bit", life:0, max:150 + Math.random()*90});
    }
    if (!running){ running = true; requestAnimationFrame(tick); }
  }
  function rain(){
    for (let i = 0; i < 40; i++) parts.push({x:Math.random()*innerWidth, y:-20 - Math.random()*innerHeight*.6, vx:(Math.random()-.5)*1.2, vy:1 + Math.random()*1.5,
      r:0, vr:0, s:6 + Math.random()*8, c:["#9C4F5E","#B76E7D","#D9B3A6"][i%3], kind:"heart", life:0, max:600, sway:Math.random()*6.28});
  }
  function tick(){
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    ctx.clearRect(0,0,innerWidth,innerHeight);
    for (const p of parts){
      p.life++;
      if (p.sway !== undefined){ p.sway += .04; p.x += Math.sin(p.sway)*.6 + p.vx; p.y += p.vy; }
      else { p.vy += .22; p.vx *= .985; p.vy *= .985; p.x += p.vx; p.y += p.vy; p.r += p.vr; }
      const fade = Math.min(1, (p.max - p.life)/40);
      ctx.save(); ctx.globalAlpha = Math.max(0, fade); ctx.translate(p.x, p.y); ctx.rotate(p.kind === "heart" ? Math.sin(p.life/20)*.3 : p.r); ctx.fillStyle = p.c;
      if (p.kind === "heart") drawHeart(p.s); else if (p.kind === "star") drawStar(p.s); else ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2);
      ctx.restore();
    }
    parts = parts.filter(p => p.life < p.max && p.y < innerHeight + 40);
    if (parts.length) requestAnimationFrame(tick); else { running = false; ctx.clearRect(0,0,innerWidth,innerHeight); }
  }
  function celebrate(){
    if (reduced) return;
    burst(innerWidth/2, innerHeight*.42, 110);
    setTimeout(() => burst(innerWidth*.2, innerHeight*.55, 60), 350);
    setTimeout(() => burst(innerWidth*.8, innerHeight*.5, 60), 650);
    setTimeout(rain, 900);
  }
  $("scene4").addEventListener("click", e => { if (e.target.closest("button")) return; if (!reduced) burst(e.clientX, e.clientY, 26); });

  /* ---------- let Fadel know (works when hosted on his site) ---------- */
  $("tellBtn").addEventListener("click", async () => {
    const b = $("tellBtn"), n = $("tellNote");
    b.disabled = true; b.textContent = "Sending...";
    try {
      const r = await fetch("https://formsubmit.co/ajax/" + EMAIL, {
        method:"POST", headers:{"Content-Type":"application/json","Accept":"application/json"},
        body: JSON.stringify({ _subject:"Nour said YES ♡", _template:"box", message:"She said YES. Forever starts now ♡" })
      });
      const d = await r.json();
      if (!r.ok || String(d.success) !== "true") throw 0;
      b.textContent = "He knows now ♡"; n.textContent = "";
      burst(innerWidth/2, innerHeight*.7, 50);
    } catch (e) {
      b.disabled = false; b.textContent = "Let Fadel know you said yes ♡";
      n.textContent = "Couldn't send it. Go tell him in person, he's waiting ♡";
    }
  });
})();
</script>
