<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<script src="/assets/theme.js"></script>
<script src="/assets/toast.js"></script>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نسيت كلمة المرور — DIRBALَK</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container { width: 100%; max-width: 420px; text-align: center; }

  .brand-logo {
    width: 100%;
    max-width: 260px;
    height: auto;
    margin: 0 auto 0.4rem;
    display: block;
  }

  .brand-arabic {
    color: #C9A84C;
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 3rem;
    opacity: 0.85;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: #C9A84C;
    margin: 0 auto 3rem;
    opacity: 0.4;
  }

  h1 {
    font-size: 15px;
    letter-spacing: 1px;
    color: #ffffff;
    margin-bottom: 0.8rem;
    font-weight: normal;
  }

  .subtext {
    color: rgba(255,255,255,0.45);
    font-size: 12px;
    line-height: 1.8;
    margin-bottom: 2rem;
  }

  .field { text-align: right; margin-bottom: 8px; }

  label {
    display: block;
    color: rgba(255,255,255,0.4);
    font-size: 10px;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  input {
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.15);
    color: #ffffff;
    padding: 14px 18px;
    font-size: 13px;
    letter-spacing: 0.5px;
    outline: none;
    text-align: right;
    font-family: Arial, sans-serif;
    width: 100%;
    transition: border-color 0.2s;
  }

  input::placeholder { color: rgba(255,255,255,0.25); }
  input:focus { border-color: rgba(201,168,76,0.5); }
  input.field-error { border-color: rgba(255,80,80,0.6); }

  .field-msg {
    color: rgba(255,80,80,0.75);
    font-size: 10px;
    margin-top: 5px;
    min-height: 12px;
    display: none;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.2);
    color: #ffffff;
    font-size: 12px;
    letter-spacing: 4px;
    cursor: pointer;
    font-family: Arial, sans-serif;
    transition: all 0.2s;
    margin-top: 1.5rem;
    margin-bottom: 1.2rem;
  }

  .submit-btn:hover { border-color: rgba(201,168,76,0.4); }
  .submit-btn:disabled { cursor: default; opacity: 0.6; }

  .form-error {
    color: rgba(255,80,80,0.85);
    font-size: 12px;
    margin-top: 10px;
    display: none;
    line-height: 1.6;
  }

  .form-success {
    color: #C9A84C;
    font-size: 13px;
    line-height: 1.9;
    display: none;
    margin-top: 1rem;
  }

  .back-link {
    display: inline-block;
    margin-top: 2rem;
    font-size: 11.5px;
    color: rgba(255,255,255,0.4);
    text-decoration: none;
  }

  .back-link:hover { color: #C9A84C; }
</style>
</head>
<body>

<div class="container">
  <img src="/logo.png" alt="DIRBALK" class="brand-logo" />
  <p class="brand-arabic">دير بالك على حالك</p>
  <div class="divider"></div>

  <div id="form-section">
    <h1>نسيت كلمة المرور؟</h1>
    <p class="subtext">اكتب بريدك الإلكتروني، رح نبعتلك رابط لإعادة تعيين كلمة المرور.</p>

    <form id="forgot-form" novalidate>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@email.com" autocomplete="email" />
        <p class="field-msg" id="email-msg"></p>
      </div>

      <p class="form-error" id="form-error"></p>

      <button type="submit" class="submit-btn" id="submit-btn">
        إرسال رابط إعادة التعيين
      </button>
    </form>
  </div>

  <p class="form-success" id="form-success"></p>

  <a href="/signin.html" class="back-link">← الرجوع لتسجيل الدخول</a>
</div>

<script>
(function () {
  const form = document.getElementById('forgot-form');
  const btn = document.getElementById('submit-btn');
  const formError = document.getElementById('form-error');
  const formSuccess = document.getElementById('form-success');

  let isSubmitting = false;
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (isSubmitting) return;
    formError.style.display = 'none';

    const email = document.getElementById('email').value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      document.getElementById('email').classList.add('field-error');
      document.getElementById('email-msg').textContent = 'الرجاء إدخال بريد إلكتروني صحيح.';
      document.getElementById('email-msg').style.display = 'block';
      return;
    }

    isSubmitting = true;
    btn.disabled = true;
    btn.textContent = 'جاري الإرسال...';

    try {
      const res = await fetch('/api/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'forgot', email }),
      });
      const result = await res.json();

      document.getElementById('form-section').style.display = 'none';
      formSuccess.textContent = result.message || 'إذا كان هذا البريد مسجّل عندنا، رح توصلك رسالة قريباً.';
      formSuccess.style.display = 'block';
      if (window.DirbalkToast) DirbalkToast.success('تم الإرسال، شيك بريدك.');
    } catch (err) {
      formError.textContent = 'حدث خطأ مؤقت، يرجى المحاولة لاحقًا.';
      formError.style.display = 'block';
      if (window.DirbalkToast) DirbalkToast.error('حدث خطأ مؤقت، يرجى المحاولة لاحقًا.');
      isSubmitting = false;
      btn.disabled = false;
      btn.textContent = 'إرسال رابط إعادة التعيين';
    }
  });
})();
</script>

<style>
  /* ---------- unified site footer ---------- */
  .site-footer {
    width: 100%;
    border-top: 0.5px solid rgba(255,255,255,0.08);
    margin-top: 48px;
    padding: 36px 20px 44px;
    text-align: center;
  }
  .site-footer .footer-links {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px 26px;
    margin-bottom: 24px;
  }
  .site-footer .footer-links a {
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(255,255,255,0.45);
    text-decoration: none;
    transition: color 0.2s;
  }
  .site-footer .footer-links a:hover { color: #C9A84C; }
  .site-footer .footer-logo { height: 18px; width: auto; opacity: 0.65; }
</style>
<footer class="site-footer">
  <nav class="footer-links">
    <a href="/">الرئيسية</a>
    <a href="/shop.html">الكوليكشن</a>
    <a href="/about.html">عن DIRBALK</a>
    <a href="/shipping.html">الشحن والإرجاع</a>
    <a href="/privacy.html">سياسة الخصوصية</a>
    <a href="/signin.html">تسجيل الدخول</a>
  </nav>
  <img src="/logo.png" alt="DIRBALK" class="footer-logo" />
</footer>
</body>
</html>
