  const form = document.getElementById('reg-form');
  const btn = document.getElementById('submit-btn');
  const formError = document.getElementById('form-error');
  const fields = ['name', 'age', 'phone', 'email'];
  let formStarted = false;

  // --- Remember that this browser already registered ---
  const STORAGE_KEY = 'dirbalk_registered';
  try {
    if (localStorage.getItem(STORAGE_KEY) === '1') {
      document.getElementById('form-section').style.display = 'none';
      document.getElementById('success-msg').style.display = 'block';
    }
  } catch (e) { /* localStorage unavailable, ignore */ }

  // --- Gender selection ---
  let selectedGender = null;
  const genderButtons = document.querySelectorAll('.gender-btn');
  genderButtons.forEach((b) => {
    b.addEventListener('click', () => {
      selectedGender = b.getAttribute('data-gender');
      genderButtons.forEach((btn2) => btn2.classList.remove('selected'));
      b.classList.add('selected');
      document.getElementById('genderRow').classList.remove('field-error');
      document.getElementById('gender-msg').style.display = 'none';
    });
  });

  // --- Searchable country picker ---
  const countryBtn = document.getElementById('countryBtn');
  const countryBtnLabel = document.getElementById('countryBtnLabel');
  const countryDropdown = document.getElementById('countryDropdown');
  const countrySearch = document.getElementById('countrySearch');
  const countryList = document.getElementById('countryList');
  let selectedCountry = COUNTRIES.find((c) => c.iso2 === 'JO') || COUNTRIES[0];

  function renderCountryList(filterText) {
    const q = (filterText || '').trim().toLowerCase();
    const filtered = q
      ? COUNTRIES.filter((c) => c.name.toLowerCase().includes(q) || c.dial.includes(q))
      : COUNTRIES;

    countryList.innerHTML = '';
    if (filtered.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'country-empty';
      empty.textContent = 'No results';
      countryList.appendChild(empty);
      return;
    }
    filtered.forEach((c) => {
      const row = document.createElement('div');
      row.className = 'country-option' + (c.iso2 === selectedCountry.iso2 ? ' active' : '');
      row.innerHTML = '<span>' + c.flag + '</span><span>' + c.name + '</span><span class="co-dial">' + c.dial + '</span>';
      row.addEventListener('click', () => {
        selectedCountry = c;
        countryBtnLabel.textContent = c.flag + ' ' + c.dial.replace('+', '') + '+';
        closeCountryDropdown();
      });
      countryList.appendChild(row);
    });
  }

  function openCountryDropdown() {
    countryDropdown.classList.add('open');
    countryBtn.classList.add('open');
    countrySearch.value = '';
    renderCountryList('');
    setTimeout(() => countrySearch.focus(), 0);
  }

  function closeCountryDropdown() {
    countryDropdown.classList.remove('open');
    countryBtn.classList.remove('open');
  }

  countryBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (countryDropdown.classList.contains('open')) closeCountryDropdown();
    else openCountryDropdown();
  });

  countrySearch.addEventListener('input', () => renderCountryList(countrySearch.value));
  countrySearch.addEventListener('click', (e) => e.stopPropagation());

  document.addEventListener('click', (e) => {
    if (!document.getElementById('countryPicker').contains(e.target)) closeCountryDropdown();
  });

  fields.forEach((id) => {
    document.getElementById(id).addEventListener('focus', () => {
      if (!formStarted) {
        formStarted = true;
        if (window.gtag) gtag('event', 'form_start', { form_name: 'dirbalk_registration' });
      }
    });
  });

  function showFieldError(id, message) {
    const input = document.getElementById(id);
    const msg = document.getElementById(id + '-msg');
    input.classList.add('field-error');
    msg.textContent = message;
    msg.style.display = 'block';
  }

  function clearFieldError(id) {
    const input = document.getElementById(id);
    const msg = document.getElementById(id + '-msg');
    input.classList.remove('field-error');
    msg.style.display = 'none';
  }

  function clearAllErrors() {
    fields.forEach(clearFieldError);
    document.getElementById('genderRow').classList.remove('field-error');
    document.getElementById('gender-msg').style.display = 'none';
    formError.style.display = 'none';
  }

  function validate(data) {
    let valid = true;

    if (!data.name) {
      showFieldError('name', 'Please enter your full name.');
      valid = false;
    }

    const age = parseInt(data.age, 10);
    if (!data.age || isNaN(age) || age < 17 || age > 40) {
      showFieldError('age', 'This registration is for ages 17-40.');
      valid = false;
    }

    if (!data.gender) {
      document.getElementById('genderRow').classList.add('field-error');
      const gm = document.getElementById('gender-msg');
      gm.textContent = 'Please select a gender.';
      gm.style.display = 'block';
      valid = false;
    }

    const localDigits2 = (data.phone || '').replace(/\D/g, '');
    if (!localDigits2 || localDigits2.length < 7 || localDigits2.length > 15) {
      showFieldError('phone', 'Invalid phone number.');
      valid = false;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
      showFieldError('email', 'Please enter a valid email address.');
      valid = false;
    }

    return valid;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearAllErrors();

    const rawPhone = document.getElementById('phone').value.trim();
    const localDigits = rawPhone.replace(/\D/g, '').replace(/^0+/, '');
    const data = {
      name: document.getElementById('name').value.trim().replace(/\s+/g, ' '),
      age: document.getElementById('age').value.trim(),
      gender: selectedGender,
      phone: localDigits ? selectedCountry.dial + localDigits : '',
      email: document.getElementById('email').value.trim().toLowerCase(),
      lang: 'en',
    };

    if (!validate(data)) {
      if (window.gtag) gtag('event', 'form_validation_error', { form_name: 'dirbalk_registration' });
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Registering...';
    if (window.gtag) gtag('event', 'form_submit_attempt', { form_name: 'dirbalk_registration' });

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await res.json();

      if (result.status === 'success') {
        if (window.gtag) gtag('event', 'form_submit_success', { form_name: 'dirbalk_registration' });
        try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) { /* ignore */ }
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
      } else {
        if (window.gtag) gtag('event', 'form_submit_error', { form_name: 'dirbalk_registration', reason: result.message || 'unknown' });
        formError.textContent = result.message || 'Something went wrong. Please try again.';
        formError.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Register';
      }
    } catch (err) {
      if (window.gtag) gtag('event', 'form_submit_error', { form_name: 'dirbalk_registration', reason: 'network' });
      formError.textContent = 'Something went wrong. Please try again.';
      formError.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Register';
    }
  });

  // --- Share buttons on the success screen ---
  const shareWhatsapp = document.getElementById('share-whatsapp');
  const copyLinkBtn = document.getElementById('copy-link');
  const copyLinkText = document.getElementById('copy-link-text');
  const siteUrl = 'https://dirbalk.com/en';
  const shareText = 'I just registered with DIRBALَK — when the collection drops, you might be first to know. Register too: ' + siteUrl;

  if (shareWhatsapp) {
    shareWhatsapp.addEventListener('click', () => {
      if (window.gtag) gtag('event', 'share_click', { method: 'whatsapp' });
      window.open('https://wa.me/?text=' + encodeURIComponent(shareText), '_blank');
    });
  }

  if (copyLinkBtn) {
    copyLinkBtn.addEventListener('click', async () => {
      if (window.gtag) gtag('event', 'share_click', { method: 'copy_link' });
      try {
        await navigator.clipboard.writeText(siteUrl);
        copyLinkText.textContent = 'Copied ✓';
        setTimeout(() => { copyLinkText.textContent = 'Copy link'; }, 2000);
      } catch (err) {
        copyLinkText.textContent = siteUrl;
      }
    });
  }
})();
