<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<script src="/assets/theme.js"></script>
<script src="/assets/toast.js"></script>
<script src="/assets/password-ux.js"></script>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — DIRBALK</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container { width: 100%; max-width: 420px; text-align: center; }

  .brand-logo {
    width: 100%;
    max-width: 260px;
    height: auto;
    margin: 0 auto 0.4rem;
    display: block;
  }

  .brand-arabic {
    color: #C9A84C;
    font-size: 14px;
    letter-spacing: 0px;
    margin-bottom: 3rem;
    opacity: 0.85;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: #C9A84C;
    margin: 0 auto 3rem;
    opacity: 0.4;
  }

  h1 {
    font-size: 15px;
    letter-spacing: 0px;
    color: #ffffff;
    margin-bottom: 2rem;
    font-weight: normal;
  }

  .field { text-align: left; }

  label {
    display: block;
    color: rgba(255,255,255,0.4);
    font-size: 10px;
    letter-spacing: 0px;
    margin-bottom: 6px;
  }

  .form-group { display: flex; flex-direction: column; gap: 14px; margin-bottom: 8px; }

  input {
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.15);
    color: #ffffff;
    padding: 14px 18px;
    font-size: 13px;
    letter-spacing: 0px;
    outline: none;
    text-align: left;
    font-family: Arial, sans-serif;
    width: 100%;
    transition: border-color 0.2s;
  }

  input::placeholder { color: rgba(255,255,255,0.25); }
  input:focus { border-color: rgba(201,168,76,0.5); }
  input.field-error { border-color: rgba(255,80,80,0.6); }

  .password-wrap { position: relative; }
  .password-wrap input { padding-left: 44px; }
  .pw-toggle {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    padding: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(212,180,131,0.55);
    transition: color 0.25s ease, transform 0.15s ease;
  }
  .pw-toggle svg { width: 19px; height: 19px; display: block; }
  .pw-toggle:hover { color: #D4B483; transform: translateY(-50%) scale(1.06); }
  .pw-toggle.active { color: #D4B483; }
  .pw-toggle:active { transform: translateY(-50%) scale(0.92); }
  .pw-toggle:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px rgba(212,180,131,0.35);
  }
  html[data-theme="day"] .pw-toggle { color: rgba(212,180,131,0.6); }
  html[data-theme="day"] .pw-toggle:hover,
  html[data-theme="day"] .pw-toggle.active { color: #D4B483; }

  @keyframes dirbalkWink {
    0% { transform: scaleY(1); }
    35% { transform: scaleY(0.15); }
    60% { transform: scaleY(1); }
    100% { transform: scaleY(1); }
  }
  .pw-toggle.winking svg { animation: dirbalkWink 0.42s cubic-bezier(.4,0,.2,1); transform-origin: 50% 55%; }
  @media (prefers-reduced-motion: reduce) {
    .pw-toggle.winking svg { animation: none; }
  }

  .field-msg {
    color: rgba(255,80,80,0.75);
    font-size: 10px;
    margin-top: 5px;
    min-height: 12px;
    display: none;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.2);
    color: #ffffff;
    font-size: 12px;
    letter-spacing: 0px;
    cursor: pointer;
    font-family: Arial, sans-serif;
    transition: all 0.2s;
    margin-top: 1.5rem;
    margin-bottom: 1.2rem;
  }

  .submit-btn:hover { border-color: rgba(201,168,76,0.4); }
  .submit-btn:disabled { cursor: default; opacity: 0.6; }

  .form-error {
    color: rgba(255,80,80,0.85);
    font-size: 12px;
    margin-top: 10px;
    display: none;
    line-height: 1.6;
  }

  .success-box {
    display: none;
  }

  .success-box p {
    color: #C9A84C;
    font-size: 13px;
    line-height: 1.9;
    margin-bottom: 1.5rem;
  }

  .success-box a {
    display: inline-block;
    background: #C9A84C;
    color: #0a0a0a;
    padding: 12px 26px;
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0px;
  }

  .invalid-box {
    display: none;
  }

  .invalid-box p {
    color: rgba(255,120,120,0.85);
    font-size: 13px;
    line-height: 1.9;
  }
</style>
</head>
<body>

<div class="container">
  <img src="/logo.png" alt="DIRBALK" class="brand-logo" />
  <p class="brand-arabic">دير بالك على حالك</p>
  <div class="divider"></div>

  <div id="form-section">
    <h1>Choose a new password</h1>

    <form id="reset-form" novalidate>
      <div class="form-group">
        <div class="field">
          <label for="password">New password</label>
          <div class="password-wrap">
            <input type="password" id="password" placeholder="8+ characters, one uppercase letter, one number" autocomplete="new-password" />
            <button type="button" class="pw-toggle" data-target="password" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14c2.3-3.3 5.4-5 8-5s5.7 1.7 8 5"/><path d="M14.8 6.3l1.1-1.6"/><path d="M17.3 7.6l1.5-1.2"/><path d="M19.4 9.6l1.7-0.6"/></svg></button>
          </div>
          <p class="field-msg" id="password-msg"></p>
        </div>
        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <div class="password-wrap">
            <input type="password" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" />
            <button type="button" class="pw-toggle" data-target="confirmPassword" aria-label="إظهار كلمة المرور"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14c2.3-3.3 5.4-5 8-5s5.7 1.7 8 5"/><path d="M14.8 6.3l1.1-1.6"/><path d="M17.3 7.6l1.5-1.2"/><path d="M19.4 9.6l1.7-0.6"/></svg></button>
          </div>
          <p class="field-msg" id="confirmPassword-msg"></p>
        </div>
      </div>

      <p class="form-error" id="form-error"></p>

      <button type="submit" class="submit-btn" id="submit-btn">
        Save Password
      </button>
    </form>
  </div>

  <div class="success-box" id="success-box">
    <p>Your password has been updated.</p>
    <a href="/en/signin.html">Sign In</a>
  </div>

  <div class="invalid-box" id="invalid-box">
    <p>This link is invalid or has expired.<br>Try requesting a new one from the sign-in page.</p>
  </div>
</div>

<script>
(function () {
  const params = new URLSearchParams(window.location.search);
  if (window.DirbalkPassword) {
    DirbalkPassword.attachStrength('password');
    DirbalkPassword.attachCapsLock('password');
    DirbalkPassword.attachCapsLock('confirmPassword');
  }

  document.querySelectorAll('.pw-toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      const showing = target.type === 'text';
      target.type = showing ? 'password' : 'text';
      btn.classList.toggle('active', !showing);
      btn.classList.remove('winking');
      void btn.offsetWidth;
      btn.classList.add('winking');
      setTimeout(() => btn.classList.remove('winking'), 450);
    });
  });

  const token = params.get('token') || '';
  const email = (params.get('email') || '').toLowerCase();

  if (!token || !email) {
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('invalid-box').style.display = 'block';
    return;
  }

  const form = document.getElementById('reset-form');
  const btn = document.getElementById('submit-btn');
  const formError = document.getElementById('form-error');

  let isSubmitting = false;
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (isSubmitting) return;
    formError.style.display = 'none';
    ['password', 'confirmPassword'].forEach((id) => {
      document.getElementById(id).classList.remove('field-error');
      document.getElementById(id + '-msg').style.display = 'none';
    });

    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    let valid = true;

    const isStrongPassword = password.length >= 8 && /[A-Z]/.test(password) && /[0-9]/.test(password);
    if (!isStrongPassword) {
      document.getElementById('password').classList.add('field-error');
      document.getElementById('password-msg').textContent = 'Password must be at least 8 characters and include one uppercase letter and one number.';
      document.getElementById('password-msg').style.display = 'block';
      valid = false;
    }
    if (password !== confirmPassword) {
      document.getElementById('confirmPassword').classList.add('field-error');
      document.getElementById('confirmPassword-msg').textContent = "Passwords don't match.";
      document.getElementById('confirmPassword-msg').style.display = 'block';
      valid = false;
    }
    if (!valid) return;

    isSubmitting = true;
    btn.disabled = true;
    btn.textContent = 'Saving...';

    try {
      const res = await fetch('/api/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'reset', email, token, password, lang: 'en' }),
      });
      const result = await res.json();

      if (result.status === 'success') {
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('success-box').style.display = 'block';
        if (window.DirbalkToast) DirbalkToast.success('Password updated.');
      } else {
        formError.textContent = result.message || 'Something went wrong, please try again.';
        formError.style.display = 'block';
        if (window.DirbalkToast) DirbalkToast.error(result.message || "Couldn't update your password.");
        isSubmitting = false;
        btn.disabled = false;
        btn.textContent = 'Save Password';
      }
    } catch (err) {
      formError.textContent = 'Something went wrong, please try again.';
      formError.style.display = 'block';
      if (window.DirbalkToast) DirbalkToast.error('Something went wrong, please try again.');
      isSubmitting = false;
      btn.disabled = false;
      btn.textContent = 'Save Password';
    }
  });
})();
</script>
