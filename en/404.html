<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<script src="/assets/theme.js"></script>
<script src="/assets/lang-switch.js"></script>
<script src="/assets/motion.js"></script>
<script src="/assets/toast.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — DIRBALK</title>
<meta name="robots" content="noindex">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }

  .wrap { max-width: 420px; }

  .brand-logo {
    height: 24px;
    width: auto;
    margin-bottom: 3rem;
    opacity: 0.9;
  }

  .code {
    font-size: clamp(60px, 18vw, 110px);
    font-weight: bold;
    letter-spacing: 0px;
    line-height: 1;
    margin-bottom: 1.6rem;
    color: rgba(255,255,255,0.92);
  }
  .code span { color: #C9A84C; }

  .msg {
    color: rgba(255,255,255,0.72);
    font-size: 13px;
    line-height: 2;
    margin-bottom: 2.6rem;
  }

  .actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .btn {
    flex: 1;
    max-width: 180px;
    padding: 14px;
    border: 0.5px solid rgba(255,255,255,0.2);
    color: #ffffff;
    font-size: 12px;
    letter-spacing: 0px;
    text-decoration: none;
    transition: all 0.2s;
  }
  .btn:hover { border-color: rgba(201,168,76,0.4); }
  .btn.primary { background: #C9A84C; color: #0a0a0a; border-color: #C9A84C; font-weight: bold; }
  .btn.primary:hover { opacity: 0.9; }
</style>
</head>
<body>
  <div class="wrap" data-reveal>
    <img src="/logo.png" alt="DIRBALK" class="brand-logo" />
    <p class="code">4<span>0</span>4</p>
    <p class="msg" id="msg404">
      Wrong turn. It happens.<br>
      Dirbalk where you go
    </p>
    <div class="actions">
      <a href="/en/" class="btn primary">Home</a>
      <a href="/en/shop.html" class="btn">Collection 01</a>
    </div>
  </div>

<script>
(function () {
  var h = new Date().getHours();
  var isNight = h < 6 || h >= 18;
  if (isNight) {
    document.getElementById('msg404').innerHTML = "Wrong turn. It happens.<br>Even at night, Dirbalk where you go";
  }
})();
</script>
</body>
</html>
