<script>
(function () {
  const form = document.getElementById('reg-form');
  const btn = document.getElementById('submit-btn');
  const formError = document.getElementById('form-error');
  const fields = ['name', 'email'];
  let formStarted = false;

  const GENDER_KEY = 'dirbalk_gender';
  const NAME_KEY = 'dirbalk_name';
  const STORAGE_KEY = 'dirbalk_logged_in';

  fields.forEach((id) => {
    document.getElementById(id).addEventListener('focus', () => {
      if (!formStarted) {
        formStarted = true;
        if (window.gtag) gtag('event', 'form_start', { form_name: 'dirbalk_waitlist' });
      }
    });
  });

  function showFieldError(id, message) {
    const input = document.getElementById(id);
    const msg = document.getElementById(id + '-msg');
    input.classList.add('field-error');
    msg.textContent = message;
    msg.style.display = 'block';
  }
  function clearFieldError(id) {
    const input = document.getElementById(id);
    const msg = document.getElementById(id + '-msg');
    input.classList.remove('field-error');
    msg.style.display = 'none';
  }
  function clearAllErrors() {
    fields.forEach(clearFieldError);
    document.getElementById('genderRow').classList.remove('field-error');
    document.getElementById('gender-msg').style.display = 'none';
    formError.style.display = 'none';
  }

  function applyGenderedText(isFemale) {
    document.getElementById('success-text').innerHTML = isFemale
      ? 'تم تسجيلك.<br>\n      عندما يصدر ⁦Collection 01⁩ ربما ستكونين أول من يعرف.<br>\n      <span class="brand-phrase">ديري بالك على حالك.</span>'
      : 'تم تسجيلك.<br>\n      عندما يصدر ⁦Collection 01⁩ ربما ستكون أول من يعرف.<br>\n      <span class="brand-phrase">دير بالك على حالك.</span>';
    document.getElementById('share-btn-text').textContent = isFemale ? 'شاركِ مع صديقاتك' : 'شارك مع صديق';
    document.getElementById('ig-reminder-text').textContent = isFemale ? 'وتابعينا على' : 'وتابعنا على';
  }

  const userBadge = document.getElementById('userBadge');
  const userBadgeBtn = document.getElementById('userBadgeBtn');
  const userAvatar = document.getElementById('userAvatar');
  const userNameLabel = document.getElementById('userNameLabel');
  const logoutBtn = document.getElementById('logoutBtn');

  function showUserBadge(name) {
    const first = (name || '').trim().split(' ')[0] || '';
    userAvatar.textContent = first ? first.charAt(0).toUpperCase() : '?';
    userNameLabel.textContent = first;
    userBadge.style.display = 'block';
  }

  userBadgeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    userBadge.classList.toggle('open');
  });
  document.addEventListener('click', (e) => {
    if (!userBadge.contains(e.target)) userBadge.classList.remove('open');
  });

  function resetToForm() {
    try {
      localStorage.removeItem(STORAGE_KEY);
      localStorage.removeItem(GENDER_KEY);
      localStorage.removeItem(NAME_KEY);
    } catch (e) { /* ignore */ }
    userBadge.style.display = 'none';
    userBadge.classList.remove('open');
    document.getElementById('success-msg').style.display = 'none';
    document.getElementById('form-section').style.display = 'block';
    form.reset();
    genderButtons.forEach((b) => b.classList.remove('selected'));
    document.getElementById('genderInput').value = '';
  }

  logoutBtn.addEventListener('click', () => {
    if (window.gtag) gtag('event', 'logout_click', { form_name: 'dirbalk_waitlist' });
    resetToForm();
  });

  const genderButtons = document.querySelectorAll('.gender-btn');
  genderButtons.forEach((b) => {
    b.addEventListener('click', () => {
      document.getElementById('genderInput').value = b.getAttribute('data-gender');
      genderButtons.forEach((btn2) => btn2.classList.remove('selected'));
      b.classList.add('selected');
      document.getElementById('genderRow').classList.remove('field-error');
      document.getElementById('gender-msg').style.display = 'none';
    });
  });

  function showLoggedIn(name, isFemale) {
    applyGenderedText(isFemale);
    showUserBadge(name);
    document.getElementById('form-section').style.display = 'none';
    document.getElementById('success-msg').style.display = 'block';
  }

  try {
    if (localStorage.getItem(STORAGE_KEY) === '1') {
      showLoggedIn(localStorage.getItem(NAME_KEY) || '', localStorage.getItem(GENDER_KEY) === 'female');
    }
  } catch (e) { /* localStorage unavailable, ignore */ }

  function validate(data) {
    let valid = true;
    if (!data.name) { showFieldError('name', 'الرجاء إدخال الاسم الكامل.'); valid = false; }
    if (!data.gender) {
      document.getElementById('genderRow').classList.add('field-error');
      const gm = document.getElementById('gender-msg');
      gm.textContent = 'الرجاء اختيار الجنس.';
      gm.style.display = 'block';
      valid = false;
    }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) { showFieldError('email', 'الرجاء إدخال بريد إلكتروني صحيح.'); valid = false; }
    return valid;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearAllErrors();

    const data = {
      name: document.getElementById('name').value.trim().replace(/\s+/g, ' '),
      gender: document.getElementById('genderInput').value || '',
      email: document.getElementById('email').value.trim().toLowerCase(),
    };

    if (!validate(data)) {
      if (window.gtag) gtag('event', 'form_validation_error', { form_name: 'dirbalk_waitlist' });
      return;
    }

    btn.disabled = true;
    btn.textContent = 'جاري التسجيل...';
    if (window.gtag) gtag('event', 'form_submit_attempt', { form_name: 'dirbalk_waitlist' });

    try {
      const res = await fetch('/api/waitlist', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await res.json();

      if (result.status === 'success') {
        if (window.gtag) gtag('event', 'form_submit_success', { form_name: 'dirbalk_waitlist' });
        try {
          localStorage.setItem(STORAGE_KEY, '1');
          localStorage.setItem(GENDER_KEY, data.gender);
          localStorage.setItem(NAME_KEY, data.name);
        } catch (e) { /* ignore */ }
        showLoggedIn(data.name, data.gender === 'female');
      } else {
        if (window.gtag) gtag('event', 'form_submit_error', { form_name: 'dirbalk_waitlist', reason: result.message || 'unknown' });
        formError.textContent = result.message || 'حدث خطأ مؤقت، يرجى المحاولة لاحقًا.';
        formError.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'تسجيل';
      }
    } catch (err) {
      if (window.gtag) gtag('event', 'form_submit_error', { form_name: 'dirbalk_waitlist', reason: 'network' });
      formError.textContent = 'حدث خطأ مؤقت، يرجى المحاولة لاحقًا.';
      formError.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'تسجيل';
    }
  });

  const shareWhatsapp = document.getElementById('share-whatsapp');
  const copyLinkBtn = document.getElementById('copy-link');
  const copyLinkText = document.getElementById('copy-link-text');
  const siteUrl = 'https://dirbalk.com';

  function getShareText() {
    let g = '';
    try { g = localStorage.getItem(GENDER_KEY) || ''; } catch (e) { /* ignore */ }
    return g === 'female'
      ? 'سجّلت بـ DIRBALَK — لما يطلع الكوليكشن ممكن تكوني أول من يعرف. سجّلي أنتِ كمان: ' + siteUrl
      : 'سجّلت بـ DIRBALَK — لما يطلع الكوليكشن ممكن تكون أول من يعرف. سجّل أنت كمان: ' + siteUrl;
  }

  if (shareWhatsapp) {
    shareWhatsapp.addEventListener('click', () => {
      if (window.gtag) gtag('event', 'share_click', { method: 'whatsapp' });
      window.open('https://wa.me/?text=' + encodeURIComponent(getShareText()), '_blank');
    });
  }

  if (copyLinkBtn) {
    copyLinkBtn.addEventListener('click', async () => {
      if (window.gtag) gtag('event', 'share_click', { method: 'copy_link' });
      try {
        await navigator.clipboard.writeText(siteUrl);
        copyLinkText.textContent = 'تم النسخ ✓';
        setTimeout(() => { copyLinkText.textContent = 'نسخ الرابط'; }, 2000);
      } catch (err) {
        copyLinkText.textContent = siteUrl;
      }
    });
  }
})();
</script>
</body>
</html>
