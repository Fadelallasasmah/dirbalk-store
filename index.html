<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIRBALَK</title>
<meta name="description" content="DIRBALK — دير بالك على حالك. Collection 01, Winter 2026.">
 <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-FMPZV540CP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-FMPZV540CP');
</script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .brand-sub {
    color: #C9A84C;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 2rem;
    opacity: 0.7;
  }

  .brand-logo {
    width: 100%;
    max-width: 320px;
    height: auto;
    margin-bottom: 0.4rem;
  }

  .brand-arabic {
    color: #C9A84C;
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 3rem;
    opacity: 0.85;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: #C9A84C;
    margin: 0 auto 3rem;
    opacity: 0.4;
  }

  .description {
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    line-height: 1.9;
    margin-bottom: 2.5rem;
    letter-spacing: 0.3px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 8px;
  }

  .field {
    text-align: right;
  }

  label {
    display: block;
    color: rgba(255,255,255,0.4);
    font-size: 10px;
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  input {
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.15);
    color: #ffffff;
    padding: 14px 18px;
    font-size: 13px;
    letter-spacing: 0.5px;
    outline: none;
    text-align: right;
    font-family: Arial, sans-serif;
    border-radius: 0;
    width: 100%;
    transition: border-color 0.2s;
  }

  input::placeholder {
    color: rgba(255,255,255,0.25);
  }

  input:focus {
    border-color: rgba(201,168,76,0.5);
  }

  input.field-error {
    border-color: rgba(255,80,80,0.6);
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
  }

  .field-msg {
    color: rgba(255,80,80,0.75);
    font-size: 10px;
    margin-top: 5px;
    letter-spacing: 0.3px;
    min-height: 12px;
    display: none;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.2);
    color: #ffffff;
    font-size: 12px;
    letter-spacing: 4px;
    cursor: pointer;
    font-family: Arial, sans-serif;
    border-radius: 0;
    transition: all 0.2s;
    margin-top: 1.5rem;
    margin-bottom: 1.2rem;
  }

  .submit-btn:hover {
    border-color: rgba(201,168,76,0.4);
  }

  .submit-btn:disabled {
    cursor: default;
    opacity: 0.6;
  }

  .footer-text {
    color: rgba(255,255,255,0.15);
    font-size: 10px;
    letter-spacing: 2px;
    margin-bottom: 1.2rem;
  }

  .privacy-link {
    color: rgba(255,255,255,0.25);
    font-size: 10px;
    letter-spacing: 0.5px;
    text-decoration: underline;
  }

  .form-error {
    color: rgba(255,80,80,0.85);
    font-size: 12px;
    margin-top: 10px;
    display: none;
    letter-spacing: 0.3px;
    line-height: 1.6;
  }

  .success-msg {
    display: none;
    text-align: center;
    padding: 2rem 0;
  }

  .success-msg p {
    color: #C9A84C;
    font-size: 13px;
    letter-spacing: 1px;
    line-height: 2;
    opacity: 0.85;
  }
</style>
</head>
<body>

<div class="container">

  <p class="brand-sub">DIRBALَK®</p>
  <img src="logo.png" alt="DIRBALK" class="brand-logo" />
  <p class="brand-arabic">دير بالك على حالك</p>
  <div class="divider"></div>

  <div id="form-section">
    <p class="description">
      لما يطلع الكوليكشن — ممكن نبعتلك.<br>
      التسجيل لا يضمن الوصول.
    </p>

    <form id="reg-form" novalidate>
      <div class="form-group">
        <div class="field">
          <label for="name">الاسم الكامل</label>
          <input type="text" id="name" placeholder="مثال: خالد" autocomplete="name" />
          <p class="field-msg" id="name-msg"></p>
        </div>
        <div class="field">
          <label for="age">العمر</label>
          <input type="number" id="age" placeholder="مثال: 22" min="1" max="99" autocomplete="off" inputmode="numeric" />
          <p class="field-msg" id="age-msg"></p>
        </div>
        <div class="field">
          <label for="phone">رقم الهاتف</label>
          <input type="tel" id="phone" placeholder="07XXXXXXXX" autocomplete="tel" inputmode="numeric" />
          <p class="field-msg" id="phone-msg"></p>
        </div>
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="example@email.com" autocomplete="email" />
          <p class="field-msg" id="email-msg"></p>
        </div>
      </div>

      <p class="form-error" id="form-error"></p>

      <button type="submit" class="submit-btn" id="submit-btn">
        تسجيل
      </button>
    </form>

    <p class="footer-text">COLLECTION 01 · WINTER 2026</p>
    <a href="privacy.html" class="privacy-link">سياسة الخصوصية</a>
  </div>

  <div class="success-msg" id="success-msg">
    <p>
      تم تسجيلك.<br>
      عندما يصدر Collection 01 ستكون أول من يعرف.<br>
      دير بالك على حالك.
    </p>
  </div>

</div>

<script>
(function () {
  const form = document.getElementById('reg-form');
  const btn = document.getElementById('submit-btn');
  const formError = document.getElementById('form-error');
  const fields = ['name', 'age', 'phone', 'email'];
  let formStarted = false;

  fields.forEach((id) => {
    document.getElementById(id).addEventListener('focus', () => {
      if (!formStarted) {
        formStarted = true;
        if (window.gtag) gtag('event', 'form_start', { form_name: 'dirbalk_registration' });
      }
    });
  });

  function showFieldError(id, message) {
    const input = document.getElementById(id);
    const msg = document.getElementById(id + '-msg');
    input.classList.add('field-error');
    msg.textContent = message;
    msg.style.display = 'block';
  }

  function clearFieldError(id) {
    const input = document.getElementById(id);
    const msg = document.getElementById(id + '-msg');
    input.classList.remove('field-error');
    msg.style.display = 'none';
  }

  function clearAllErrors() {
    fields.forEach(clearFieldError);
    formError.style.display = 'none';
  }

  function validate(data) {
    let valid = true;

    if (!data.name) {
      showFieldError('name', 'الرجاء إدخال الاسم الكامل.');
      valid = false;
    }

    const age = parseInt(data.age, 10);
    if (!data.age || isNaN(age) || age < 17 || age > 40) {
      showFieldError('age', 'هذا التسجيل مخصص للفئة العمرية 17-40.');
      valid = false;
    }

    if (!/^07[0-9]{8}$/.test(data.phone)) {
      showFieldError('phone', 'رقم الهاتف غير صحيح (07 ثم 8 أرقام).');
      valid = false;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
      showFieldError('email', 'الرجاء إدخال بريد إلكتروني صحيح.');
      valid = false;
    }

    return valid;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearAllErrors();

    const data = {
      name: document.getElementById('name').value.trim().replace(/\s+/g, ' '),
      age: document.getElementById('age').value.trim(),
      phone: document.getElementById('phone').value.trim(),
      email: document.getElementById('email').value.trim().toLowerCase(),
    };

    if (!validate(data)) {
      if (window.gtag) gtag('event', 'form_validation_error', { form_name: 'dirbalk_registration' });
      return;
    }

    btn.disabled = true;
    btn.textContent = 'جاري التسجيل...';
    if (window.gtag) gtag('event', 'form_submit_attempt', { form_name: 'dirbalk_registration' });

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await res.json();

      if (result.status === 'success') {
        if (window.gtag) gtag('event', 'form_submit_success', { form_name: 'dirbalk_registration' });
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
      } else {
        if (window.gtag) gtag('event', 'form_submit_error', { form_name: 'dirbalk_registration', reason: result.message || 'unknown' });
        formError.textContent = result.message || 'حدث خطأ مؤقت، يرجى المحاولة لاحقًا.';
        formError.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'تسجيل';
      }
    } catch (err) {
      if (window.gtag) gtag('event', 'form_submit_error', { form_name: 'dirbalk_registration', reason: 'network' });
      formError.textContent = 'حدث خطأ مؤقت، يرجى المحاولة لاحقًا.';
      formError.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'تسجيل';
    }
  });
})();
</script>

</body>
</html>
