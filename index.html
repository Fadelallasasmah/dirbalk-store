<div class="container">

  <p class="brand-sub">DIRBALَK®</p>
  <img src="logo.png" alt="DIRBALK" class="brand-logo" />
  <p class="brand-arabic">دير بالك على حالك</p>
  <div class="divider"></div>

  <div id="form-section">
    <p class="description">
      لما يطلع الكوليكشن — ممكن نبعتلك.<br>
      التسجيل لا يضمن الوصول.
    </p>

    <form id="reg-form" novalidate>
      <div class="form-group">
        <div class="field">
          <label for="name">الاسم الكامل</label>
          <input type="text" id="name" placeholder="مثال: خالد" autocomplete="name" />
          <p class="field-msg" id="name-msg"></p>
        </div>
        <div class="field">
          <label for="age">العمر</label>
          <input type="number" id="age" placeholder="مثال: 23" min="1" max="99" autocomplete="off" inputmode="numeric" />
          <p class="field-msg" id="age-msg"></p>
        </div>
        <div class="field">
          <label for="phone">رقم الهاتف</label>
          <div class="phone-row">
            <input type="tel" id="phone" placeholder="XXXXXXXXX" autocomplete="tel" inputmode="numeric" />
            <select id="countryCode" autocomplete="tel-country-code"></select>
          </div>
          <p class="field-msg" id="phone-msg"></p>
        </div>
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" placeholder="example@email.com" autocomplete="email" />
          <p class="field-msg" id="email-msg"></p>
        </div>
      </div>

      <p class="form-error" id="form-error"></p>

      <button type="submit" class="submit-btn" id="submit-btn">
        تسجيل
      </button>
    </form>

    <p class="footer-text">COLLECTION 01 · WINTER 2026</p>
    <a href="privacy.html" class="privacy-link">سياسة الخصوصية</a>
  </div>

  <div class="success-msg" id="success-msg">
    <p>
      تم تسجيلك.<br>
      عندما يصدر Collection 01 ربما ستكون أول من يعرف.<br>
      دير بالك على حالك.
    </p>
  </div>

</div>

{"iso2":"MA","dial":"+212","name":"المغرب","nameEn":"Morocco"},{"iso2":"GB","dial":"+44","name":"المملكة المتحدة","nameEn":"United Kingdom"},{"iso2":"NO","dial":"+47","name":"النرويج","nameEn":"Norway"},{"iso2":"IN","dial":"+91","name":"الهند","nameEn":"India"},{"iso2":"US","dial":"+1","name":"الولايات المتحدة","nameEn":"United States"},{"iso2":"JP","dial":"+81","name":"اليابان","nameEn":"Japan"},{"iso2":"PK","dial":"+92","name":"باكستان","nameEn":"Pakistan"},{"iso2":"TR","dial":"+90","name":"تركيا","nameEn":"Türkiye"},{"iso2":"TN","dial":"+216","name":"تونس","nameEn":"Tunisia"},{"iso2":"ZA","dial":"+27","name":"جنوب أفريقيا","nameEn":"South Africa"},{"iso2":"RU","dial":"+7","name":"روسيا","nameEn":"Russian Federation"},{"iso2":"CH","dial":"+41","name":"سويسرا","nameEn":"Switzerland"},{"iso2":"FR","dial":"+33","name":"فرنسا","nameEn":"France"},{"iso2":"CA","dial":"+1","name":"كندا","nameEn":"Canada"},{"iso2":"KR","dial":"+82","name":"كوريا الجنوبية","nameEn":"Korea, Republic of"},{"iso2":"LY","dial":"+218","name":"ليبيا","nameEn":"Libya"},{"iso2":"MY","dial":"+60","name":"ماليزيا","nameEn":"Malaysia"},{"iso2":"NL","dial":"+31","name":"هولندا","nameEn":"Netherlands"}];

  const form = document.getElementById('reg-form');
  const btn = document.getElementById('submit-btn');
  const formError = document.getElementById('form-error');
  const countrySelect = document.getElementById('countryCode');
  const fields = ['name', 'age', 'phone', 'email'];
  let formStarted = false;

  // Populate the country code dropdown
  COUNTRIES.forEach((c) => {
    const opt = document.createElement('option');
    opt.value = c.dial;
    opt.textContent = c.name + ' ' + c.dial;
    if (c.iso2 === 'JO') opt.selected = true;
    countrySelect.appendChild(opt);
  });

  fields.forEach((id) => {
    document.getElementById(id).addEventListener('focus', () => {
      if (!formStarted) {
        formStarted = true;
        if (window.gtag) gtag('event', 'form_start', { form_name: 'dirbalk_registration' });
      }
    });
  });

  function showFieldError(id, message) {
    const input = document.getElementById(id);
    const msg = document.getElementById(id + '-msg');
    input.classList.add('field-error');
    msg.textContent = message;
    msg.style.display = 'block';
  }

  function clearFieldError(id) {
    const input = document.getElementById(id);
    const msg = document.getElementById(id + '-msg');
    input.classList.remove('field-error');
    msg.style.display = 'none';
  }

  function clearAllErrors() {
    fields.forEach(clearFieldError);
    formError.style.display = 'none';
  }

  function validate(data) {
    let valid = true;

    if (!data.name) {
      showFieldError('name', 'الرجاء إدخال الاسم الكامل.');
      valid = false;
    }

    const age = parseInt(data.age, 10);
    if (!data.age || isNaN(age) || age < 17 || age > 40) {
      showFieldError('age', 'هذا التسجيل مخصص للفئة العمرية 17-40.');
      valid = false;
    }

    const localDigits2 = (data.phone || '').replace(/\D/g, '');
    if (!localDigits2 || localDigits2.length < 7 || localDigits2.length > 15) {
      showFieldError('phone', 'رقم الهاتف غير صحيح.');
      valid = false;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email)) {
      showFieldError('email', 'الرجاء إدخال بريد إلكتروني صحيح.');
      valid = false;
    }

    return valid;
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearAllErrors();

    const rawPhone = document.getElementById('phone').value.trim();
    const localDigits = rawPhone.replace(/\D/g, '').replace(/^0+/, '');
    const data = {
      name: document.getElementById('name').value.trim().replace(/\s+/g, ' '),
      age: document.getElementById('age').value.trim(),
      phone: localDigits ? countrySelect.value + localDigits : '',
      email: document.getElementById('email').value.trim().toLowerCase(),
    };

    if (!validate(data)) {
      if (window.gtag) gtag('event', 'form_validation_error', { form_name: 'dirbalk_registration' });
      return;
    }

    btn.disabled = true;
    btn.textContent = 'جاري التسجيل...';
    if (window.gtag) gtag('event', 'form_submit_attempt', { form_name: 'dirbalk_registration' });

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      const result = await res.json();

      if (result.status === 'success') {
        if (window.gtag) gtag('event', 'form_submit_success', { form_name: 'dirbalk_registration' });
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('success-msg').style.display = 'block';
      } else {
        if (window.gtag) gtag('event', 'form_submit_error', { form_name: 'dirbalk_registration', reason: result.message || 'unknown' });
        formError.textContent = result.message || 'حدث خطأ مؤقت، يرجى المحاولة لاحقًا.';
        formError.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'تسجيل';
      }
    } catch (err) {
      if (window.gtag) gtag('event', 'form_submit_error', { form_name: 'dirbalk_registration', reason: 'network' });
      formError.textContent = 'حدث خطأ مؤقت، يرجى المحاولة لاحقًا.';
      formError.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'تسجيل';
    }
  });
})();
</script>
