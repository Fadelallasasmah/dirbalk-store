<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIRBALَK</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    background: #0a0a0a;
    color: #ffffff;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .container {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }

  .brand-sub {
    color: #C9A84C;
    font-size: 11px;
    letter-spacing: 4px;
    margin-bottom: 2rem;
    opacity: 0.7;
  }

  .brand-name {
    color: #ffffff;
    font-size: clamp(36px, 10vw, 52px);
    font-weight: 700;
    letter-spacing: 6px;
    margin-bottom: 0.4rem;
    line-height: 1;
  }

  .brand-arabic {
    color: #C9A84C;
    font-size: 14px;
    letter-spacing: 2px;
    margin-bottom: 3rem;
    opacity: 0.85;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: #C9A84C;
    margin: 0 auto 3rem;
    opacity: 0.4;
  }

  .description {
    color: rgba(255,255,255,0.5);
    font-size: 13px;
    line-height: 1.9;
    margin-bottom: 2.5rem;
    letter-spacing: 0.3px;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 12px;
  }

  input {
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.15);
    color: #ffffff;
    padding: 14px 18px;
    font-size: 13px;
    letter-spacing: 0.5px;
    outline: none;
    text-align: right;
    font-family: Arial, sans-serif;
    border-radius: 0;
    width: 100%;
    transition: border-color 0.2s;
  }

  input::placeholder {
    color: rgba(255,255,255,0.25);
  }

  input:focus {
    border-color: rgba(201,168,76,0.5);
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.2);
    color: #ffffff;
    font-size: 12px;
    letter-spacing: 4px;
    cursor: pointer;
    font-family: Arial, sans-serif;
    border-radius: 0;
    transition: all 0.2s;
    margin-bottom: 2rem;
  }

  .submit-btn:hover {
    border-color: rgba(201,168,76,0.4);
  }

  .submit-btn.success {
    border-color: rgba(201,168,76,0.6);
    color: #C9A84C;
  }

  .submit-btn:disabled {
    cursor: default;
  }

  .footer-text {
    color: rgba(255,255,255,0.15);
    font-size: 10px;
    letter-spacing: 2px;
  }

  .error-msg {
    color: rgba(255,80,80,0.8);
    font-size: 11px;
    margin-top: 8px;
    display: none;
    letter-spacing: 0.5px;
  }

  .success-msg {
    display: none;
    text-align: center;
    padding: 2rem 0;
  }

  .success-msg p {
    color: #C9A84C;
    font-size: 13px;
    letter-spacing: 1px;
    line-height: 2;
    opacity: 0.85;
  }
</style>
</head>
<body>

<div class="container">

  <p class="brand-sub">DIRBALَK®</p>
  <h1 class="brand-name">DIRBALK</h1>
  <p class="brand-arabic">دير بالك على حالك</p>
  <div class="divider"></div>

  <div id="form-section">
    <p class="description">
      لما يطلع الكوليكشن — رح نبعتلك أول.<br>
      التسجيل لا يضمن الوصول.
    </p>

    <div class="form-group">
      <input type="text" id="name" placeholder="الاسم الكامل" autocomplete="off" />
      <input type="number" id="age" placeholder="العمر" min="1" max="99" autocomplete="off" />
      <input type="tel" id="phone" placeholder="رقم الهاتف" autocomplete="off" />
      <input type="email" id="email" placeholder="البريد الإلكتروني" autocomplete="off" />
    </div>

    <p class="error-msg" id="error-msg">يرجى تعبئة جميع الحقول</p>

    <button class="submit-btn" id="submit-btn" onclick="handleSubmit()">
      تسجيل
    </button>

    <p class="footer-text">COLLECTION 01 · WINTER 2026</p>
  </div>

  <div class="success-msg" id="success-msg">
    <p>
      تم التسجيل.<br>
      دير بالك على حالك.
    </p>
  </div>

</div>

<script>
async function handleSubmit() {
  const name = document.getElementById('name').value.trim();
  const age = document.getElementById('age').value.trim();
  const phone = document.getElementById('phone').value.trim();
  const email = document.getElementById('email').value.trim();
  const errorMsg = document.getElementById('error-msg');
  const btn = document.getElementById('submit-btn');

  if (!name || !age || !phone || !email) {
    errorMsg.style.display = 'block';
    setTimeout(() => errorMsg.style.display = 'none', 3000);
    return;
  }

  btn.textContent = '...';
  btn.disabled = true;

  const data = { name, age, phone, email, timestamp: new Date().toISOString() };

  try {
    await fetch('https://script.google.com/macros/s/AKfycbxgdOzSGER9lgesYbjH8Igu2NSPfc0VSbYZ0kd4rsJXEtxfv9aHnMxWMMLflqH_5C2dVQ/exec', {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
  } catch(e) {}

  document.getElementById('form-section').style.display = 'none';
  document.getElementById('success-msg').style.display = 'block';
}
</script>

</body>
</html>
