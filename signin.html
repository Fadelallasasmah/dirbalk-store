<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 25;
    background: rgba(10,10,10,0.92);
    backdrop-filter: blur(6px);
    border-bottom: 0.5px solid rgba(255,255,255,0.1);
  }
  .header-inner {
    max-width: 1100px;

  .header-logo { height: 22px; width: auto; display: block; }

  .hamburger-btn {

    grid-column: 1; justify-self: start;
    background: transparent; border: none;

  .hamburger-btn span { display: block; width: 100%; height: 1.4px; background: currentColor; transition: transform 0.25s ease, opacity 0.2s ease; }
  .hamburger-btn.open span:nth-child(1) { transform: translateY(6.4px) rotate(45deg); }
  .hamburger-btn.open span:nth-child(2) { opacity: 0; }
  .hamburger-btn.open span:nth-child(3) { transform: translateY(-6.4px) rotate(-45deg); }

  .side-menu-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 96; }
  .side-menu-overlay.open { display: block; }

  #sideMenuPanel {
    display: flex;
    position: fixed;
    top: 0; left: 0;
    height: 100vh; width: 100%; max-width: 300px;
    background: #0d0d0d;

  .side-menu-close {

  .side-menu-links { display: flex; flex-direction: column; gap: 4px; }
  .side-menu-links a {

    font-size: 14px; padding: 12px 4px;
    border-bottom: 0.5px solid rgba(255,255,255,0.07);
  }
  .side-menu-links a:hover { color: #C9A84C; }

  h1 {
    font-size: 15px;

    color: #ffffff;
    margin-bottom: 2rem;
    font-weight: normal;
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 8px;
  }

  .field {
    text-align: right;
  }

  label {
    display: block;
    color: rgba(255,255,255,0.4);
    font-size: 10px;
    letter-spacing: 0px;
    margin-bottom: 6px;
  }

  input {
    background: transparent;

    padding: 14px 18px;

    letter-spacing: 0px;
    outline: none;

    width: 100%;
    transition: border-color 0.2s;

  input::placeholder { color: rgba(255,255,255,0.25); }
  input:focus { border-color: rgba(201,168,76,0.5); }
  input.field-error { border-color: rgba(255,80,80,0.6); }

  .password-wrap { position: relative; }
  .password-wrap input { padding-left: 44px; }
  .pw-toggle {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.45);
    transition: color 0.2s;
  }
  .pw-toggle svg { width: 18px; height: 18px; display: block; }
  .pw-toggle:hover, .pw-toggle.active { color: #C9A84C; }

  .field-msg {
    color: rgba(255,80,80,0.75);
    font-size: 10px;
    margin-top: 5px;
    letter-spacing: 0px;
    min-height: 12px;
    display: none;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 0.5px solid rgba(255,255,255,0.2);
    color: #ffffff;
    font-size: 12px;
    letter-spacing: 0px;
    cursor: pointer;
    font-family: Arial, sans-serif;
    border-radius: 0;
    transition: all 0.2s;
    margin-top: 1.5rem;
    margin-bottom: 1.2rem;
  }

  .submit-btn:hover { border-color: rgba(201,168,76,0.4); }
  .submit-btn:disabled { cursor: default; opacity: 0.6; }

  .form-error {
    color: rgba(255,80,80,0.85);
    font-size: 12px;
    margin-top: 10px;
    display: none;
    letter-spacing: 0px;

  .no-account {

  .no-account a {

  .forgot-link {

<header>
  <div class="header-inner">
    <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="القائمة" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <a href="/" class="logo-link"><img src="/logo.png" alt="DIRBALK" class="header-logo" /></a>
  </div>
</header>

<div class="side-menu-overlay" id="sideMenuOverlay"></div>
<nav id="sideMenuPanel" aria-label="القائمة الرئيسية">
  <button type="button" class="side-menu-close" id="sideMenuClose" aria-label="إغلاق القائمة">✕</button>
  <div class="side-menu-links">
    <a href="/">الرئيسية</a>
    <a href="/shop.html">الكوليكشن</a>
    <a href="/about.html">عن DIRBALK</a>
    <a href="/me.html">حسابي</a>
  </div>
</nav>

<div class="container">

  <img src="/logo.png" alt="DIRBALK" class="brand-logo" />
  <p class="brand-arabic">دير بالك على حالك</p>
  <div class="divider"></div>

  <h1>تسجيل الدخول لحسابك</h1>

  <form id="signin-form" novalidate>
    <div class="form-group">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input type="email" id="email" placeholder="example@email.com" autocomplete="email" />
        <p class="field-msg" id="email-msg"></p>
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="pw-toggle" data-target="password" aria-label="إظهار كلمة المرور"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <p class="field-msg" id="password-msg"></p>
        <a href="forgot-password.html" class="forgot-link">نسيت كلمة المرور؟</a>
      </div>
    </div>

    <p class="form-error" id="form-error"></p>

    <button type="submit" class="submit-btn" id="submit-btn">
      تسجيل الدخول
    </button>
  </form>

  <p class="no-account">
    ما عندك حساب؟ <a href="/">أنشئ حساب جديد</a>
  </p>

  <p class="footer-text">COLLECTION 01 · WINTER 2026</p>

</div>

<script>
(function () {
  const form = document.getElementById('signin-form');
  if (window.DirbalkPassword) DirbalkPassword.attachCapsLock('password');

  document.querySelectorAll('.pw-toggle').forEach((btn) => {
    btn.addEventListener('click', () => {
      const target = document.getElementById(btn.dataset.target);
      const showing = target.type === 'text';
      target.type = showing ? 'password' : 'text';
      btn.classList.toggle('active', !showing);
    });
  });

  const btn = document.getElementById('submit-btn');
  const formError = document.getElementById('form-error');

  function showFieldError(id, message) {
    const input = document.getElementById(id);
    const msg = document.getElementById(id + '-msg');
    input.classList.add('field-error');
    msg.textContent = message;
    msg.style.display = 'block';
  }

  function clearAllErrors() {
    ['email', 'password'].forEach((id) => {
      document.getElementById(id).classList.remove('field-error');
      document.getElementById(id + '-msg').style.display = 'none';
    });
    formError.style.display = 'none';
  }

  let isSubmitting = false;
  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    if (isSubmitting) return;
    clearAllErrors();

    const email = document.getElementById('email').value.trim().toLowerCase();
    const password = document.getElementById('password').value;

    let valid = true;
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      showFieldError('email', 'الرجاء إدخال بريد إلكتروني صحيح.');
      valid = false;
    }
    if (!password) {
      showFieldError('password', 'الرجاء إدخال كلمة المرور.');
      valid = false;
    }
    if (!valid) return;

    isSubmitting = true;
    btn.disabled = true;
    btn.textContent = 'جاري الدخول...';
    if (window.gtag) gtag('event', 'login_attempt');

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'login', email, password, lang: 'ar' }),
      });
      const result = await res.json();

      if (result.status === 'success') {
        if (window.gtag) {
          gtag('event', 'login_success');
          gtag('event', 'login', { method: 'password' });
        }
        try {
          localStorage.setItem('dirbalk_logged_in', '1');
          localStorage.setItem('dirbalk_name', result.name || '');
          localStorage.setItem('dirbalk_gender', result.gender || '');
          localStorage.setItem('dirbalk_email', result.email || email);
          localStorage.setItem('dirbalk_phone', result.phone || '');
          localStorage.setItem('dirbalk_has_password', '1');  // a successful password login proves the account has one
          localStorage.removeItem('dirbalk_pending_verification');
        } catch (err) { /* ignore */ }
        if (window.DirbalkToast) DirbalkToast.success('أهلاً فيك من جديد.');
        window.location.href = '/';
      } else {
        if (window.gtag) gtag('event', 'login_error', { reason: result.message || 'unknown' });
        formError.textContent = result.message || 'حدث خطأ مؤقت، يرجى المحاولة لاحقًا.';
        formError.style.display = 'block';
        if (window.DirbalkToast) DirbalkToast.error(result.message || 'تسجيل الدخول ما نجح.');
        isSubmitting = false;
        btn.disabled = false;
        btn.textContent = 'تسجيل الدخول';
      }
    } catch (err) {
      formError.textContent = 'حدث خطأ مؤقت، يرجى المحاولة لاحقًا.';
      formError.style.display = 'block';
      if (window.DirbalkToast) DirbalkToast.error('حدث خطأ مؤقت، يرجى المحاولة لاحقًا.');
      isSubmitting = false;
      btn.disabled = false;
      btn.textContent = 'تسجيل الدخول';
    }
  });

  /* ---------------- mobile hamburger + side menu ---------------- */
  var hamburgerBtn = document.getElementById('hamburgerBtn');
  var sideMenuPanel = document.getElementById('sideMenuPanel');
  var sideMenuOverlay = document.getElementById('sideMenuOverlay');

  function openSideMenu() {
    sideMenuPanel.classList.add('open');
    sideMenuOverlay.classList.add('open');
    hamburgerBtn.classList.add('open');
    hamburgerBtn.setAttribute('aria-expanded', 'true');
  }
  function closeSideMenu() {
    sideMenuPanel.classList.remove('open');
    sideMenuOverlay.classList.remove('open');
    hamburgerBtn.classList.remove('open');
    hamburgerBtn.setAttribute('aria-expanded', 'false');
  }
  hamburgerBtn.addEventListener('click', function () {
    if (sideMenuPanel.classList.contains('open')) closeSideMenu(); else openSideMenu();
  });
  document.getElementById('sideMenuClose').addEventListener('click', closeSideMenu);
  sideMenuOverlay.addEventListener('click', closeSideMenu);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSideMenu(); });
})();
</script>
